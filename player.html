    ctx.lineWidth = Math.max(2, Math.min(W * 0.008, 6));
    ctx.stroke();
  }
  
  // ── Outer ring (64 bars, FFT) ───────────────────────────────
  const outerR = minD * 0.44 * pulseScale;
  ctx.beginPath();
  ctx.arc(0, 0, outerR, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(${rP},${gP},${bP},0.3)`;
  ctx.lineWidth = 0.8;
  ctx.stroke();
  
  for (let i = 0; i < 64; i++) {
    const angle = (i / 64) * Math.PI * 2 - Math.PI / 2;
    const val = getMirroredFft(i, 64, 0, 0.3);
    const barH = val * minD * 0.18;
    if (barH < 1) continue;
    
    const lc = lerpColor(pal[2], pal[3], smoothBass);
    const alpha = 0.7 + smoothBass * 0.3;
    
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * (outerR + 2), Math.sin(angle) * (outerR + 2));
    ctx.lineTo(Math.cos(angle) * (outerR + 2 + barH), Math.sin(angle) * (outerR + 2 + barH));
    ctx.strokeStyle = `rgba(${lc[0]|0},${lc[1]|0},${lc[2]|0},${alpha})`;
    ctx.lineWidth = Math.max(3, Math.min(W * 0.009, 9));
    ctx.stroke();
  }
  
  // ── Mid ring (48 bars) ──────────────────────────────────────
  const midR = minD * 0.36;
  ctx.beginPath();
  ctx.arc(0, 0, midR, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(${rP},${gP},${bP},0.2)`;
  ctx.lineWidth = 0.5;
  ctx.stroke();
  
  for (let i = 0; i < 48; i++) {
    const angle = (i / 48) * Math.PI * 2 - Math.PI / 2;
    const val = getMirroredFft(i, 48, 0.15, 0.45);
    const barH = val * minD * 0.06;
    if (barH < 0.5) continue;
    
    const lc = lerpColor(pal[2], pal[3], smoothMid);
    const alpha = 0.3 + smoothMid * 0.4;
    
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * (midR + 2), Math.sin(angle) * (midR + 2));
    ctx.lineTo(Math.cos(angle) * (midR + 2 + barH), Math.sin(angle) * (midR + 2 + barH));
    ctx.strokeStyle = `rgba(${lc[0]|0},${lc[1]|0},${lc[2]|0},${alpha})`;
    ctx.lineWidth = Math.max(1, Math.min(W * 0.004, 3));
    ctx.stroke();
  }
  
  ctx.restore();
  
  // ── Inner ring (32 bars, gravity fade — not rotated) ────────
  ctx.save();
  ctx.translate(CX, CY);
  
  const innerR = minD * 0.28;
  ctx.beginPath();
  ctx.arc(0, 0, innerR, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(${rP},${gP},${bP},0.25)`;
  ctx.lineWidth = 0.6;
  ctx.stroke();
  
  for (let i = 0; i < 32; i++) {
    const angle = (i / 32) * Math.PI * 2 - Math.PI / 2;
    const val = getMirroredFft(i, 32, 0.5, 0.7);
    const barH = val * minD * 0.08;
    if (barH < 0.5) continue;
    
    const lc = lerpColor(pal[2], pal[3], smoothHigh);
    const alpha = 0.5 + smoothHigh * 0.4;
    
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * (innerR + 2), Math.sin(angle) * (innerR + 2));
    ctx.lineTo(Math.cos(angle) * (innerR + 2 + barH), Math.sin(angle) * (innerR + 2 + barH));
    ctx.strokeStyle = `rgba(${lc[0]|0},${lc[1]|0},${lc[2]|0},${alpha})`;
    ctx.lineWidth = Math.max(2.5, Math.min(W * 0.007, 7));
    ctx.stroke();
  }
  
  ctx.restore();
  
  // ── Bass glow (iOS: blurred radial circle) ──────────────────
  if (smoothBass > 0.01) {
    const glowR = minD * 0.225 + smoothBass * minD * 0.25;
    const glowGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, glowR);
    glowGrad.addColorStop(0, `rgba(${rP},${gP},${bP},${0.45 * smoothBass})`);
    glowGrad.addColorStop(0.5, `rgba(${rP},${gP},${bP},${0.2 * smoothBass})`);
    glowGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(0, 0, W, H);
    
    // Center hot spot
    const cGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, minD * 0.08 + smoothBass * minD * 0.04);
    cGrad.addColorStop(0, `rgba(${rP},${gP},${bP},${0.3 * smoothBass})`);
    cGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = cGrad;
    ctx.fillRect(0, 0, W, H);
  }
}

// ── Video Rings: Simpler overlay for video presets (OMEN2/3) ───
// ── Text Overlay: Editable animated text (dynamic sans-serif) ──
// Uses Space Grotesk from Google Fonts (loaded in HTML head)
function renderTextOverlay(pal) {
  const minD = Math.min(W, H) * GFX_SCALE;
  const [rP, gP, bP] = hexRgb(pal[2]);
  const [rB, gB, bB] = hexRgb(pal[3]);
  
  const preset = PRESETS[activePreset] || {};
  const mainText = preset.gfxText || 'ØMEN';
  const subText = preset.gfxSubText || '';
  
  ctx.save();
  ctx.translate(CX, CY);
  
  // Subtle rotation drift
  const drift = Math.sin(animTime * 0.3) * 0.008;
  ctx.rotate(drift);
  
  // Beat pulse scale
  const textPulse = 1.0 + beatFlash * 0.06 + smoothBass * 0.03;
  ctx.scale(textPulse, textPulse);
  
  // ── Main text ──
  const fontSize = minD * 0.18;
  ctx.font = `300 ${fontSize}px 'Space Grotesk', 'Inter', system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  // Letter spacing via manual character placement
  const tracking = 0.25 + smoothVol * 0.15; // em units
  const chars = mainText.split('');
  const charWidths = chars.map(c => ctx.measureText(c).width);
  const spacingPx = fontSize * tracking;
  const totalW = charWidths.reduce((a, b) => a + b, 0) + spacingPx * (chars.length - 1);
  
  // Glitch offset on beat
  const glitchX = beatFlash > 0.3 ? (Math.random() - 0.5) * minD * 0.01 : 0;
  const glitchY = beatFlash > 0.3 ? (Math.random() - 0.5) * minD * 0.005 : 0;
  
  const baseAlpha = 0.6 + smoothVol * 0.3 + beatFlash * 0.1;
  
  // Draw each character
  let xPos = -totalW / 2;
  chars.forEach((char, i) => {
    // Per-character vertical wave
    const wave = Math.sin(animTime * 1.5 + i * 0.4) * minD * 0.003;
    
    ctx.fillStyle = `rgba(${rP},${gP},${bP},${baseAlpha.toFixed(3)})`;
    ctx.fillText(char, xPos + charWidths[i] / 2 + glitchX, wave + glitchY);
    
    xPos += charWidths[i] + spacingPx;
  });
  
  // ── Beat flash: brief bright duplicate (offset) ──
  if (beatFlash > 0.15) {
    const flashAlpha = beatFlash * 0.3;
    xPos = -totalW / 2;
    chars.forEach((char, i) => {
      const wave = Math.sin(animTime * 1.5 + i * 0.4) * minD * 0.003;
      ctx.fillStyle = `rgba(${rB},${gB},${bB},${flashAlpha.toFixed(3)})`;
      ctx.fillText(char, xPos + charWidths[i] / 2 + minD * 0.003, wave - minD * 0.003);
      xPos += charWidths[i] + spacingPx;
    });
  }
  
  // ── Subtitle ──
  if (subText) {
    const subSize = fontSize * 0.22;
    ctx.font = `400 ${subSize}px 'Space Grotesk', 'Inter', system-ui, sans-serif`;
    const subAlpha = 0.2 + smoothVol * 0.2;
    ctx.fillStyle = `rgba(${rP},${gP},${bP},${subAlpha.toFixed(3)})`;
    // Wide letter spacing for subtitle
    const subChars = subText.split('');
    const subWidths = subChars.map(c => ctx.measureText(c).width);
    const subSpacing = subSize * 0.5;
    const subTotalW = subWidths.reduce((a, b) => a + b, 0) + subSpacing * (subChars.length - 1);
    let sx = -subTotalW / 2;
    subChars.forEach((char) => {
      ctx.fillText(char, sx + ctx.measureText(char).width / 2, fontSize * 0.55);
      sx += ctx.measureText(char).width + subSpacing;
    });
  }
  
  // ── Thin horizontal line accent ──
  const lineW = minD * 0.3 * (0.8 + smoothVol * 0.2);
  const lineAlpha = 0.1 + smoothVol * 0.15;
  ctx.strokeStyle = `rgba(${rP},${gP},${bP},${lineAlpha.toFixed(3)})`;
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(-lineW, fontSize * 0.32);
  ctx.lineTo(lineW, fontSize * 0.32);
  ctx.stroke();
  
  ctx.restore();
}

// ── TYPO: Fullscreen text theme ──────────────────────────────────
let typoScale = 1.0;
let typoTargetScale = 1.0;
let typoX = 0, typoY = 0;
let typoTargetX = 0, typoTargetY = 0;
let typoFlash = 0;
let typoSpread = 0; // spacing explosion (0 = base, 1 = max spread)

function typoOnBeat() {
  const preset = PRESETS[activePreset];
  if (!preset || getPresetTheme(preset) !== 'typo') return;
  
  const energy = normEnergy || 0;
  const bar4 = beatIndex % 4;
  const fx = preset.fx || 'none';
  
  // Combined animation intensity: drive × fxIntensity
  const intensity = driveScale * fxIntensity;
  // intensity 0 = no animation, 1 = full
  
  // ── SCALE ──
  if (fx === 'scale') {
    const picks = [0.4, 0.6, 1.0, 1.5, 2.0, 2.8, 0.3, 1.8];
    const raw = picks[beatIndex % picks.length];
    // Lerp toward raw based on intensity (low intensity → stays near 1.0)
    typoScale = 1.0 + (raw - 1.0) * intensity;
    typoTargetScale = typoScale;
  } else if (fx === 'jump') {
    typoTargetScale = 1.0 + (Math.random() * 0.3 - 0.15) * intensity;
  } else if (energy > 0.5) {
    typoTargetScale = 1.0 + Math.random() * 0.6 * intensity;
  } else {
    typoTargetScale = 1.0 + (Math.random() * 0.2 - 0.1) * intensity;
  }
  
  // ── JUMP ──
  if (fx === 'jump') {
    const positions = [
      [0, 0], [0, -0.35], [0, 0.35],
      [-0.3, -0.25], [0.3, 0.25],
      [-0.35, 0], [0.35, 0],
      [0, -0.45], [0.2, -0.3],
      [-0.25, 0.2], [0.15, 0.4],
    ];
    const pos = positions[Math.floor(Math.random() * positions.length)];
    // Scale position offset by intensity
    typoX = pos[0] * intensity; typoY = pos[1] * intensity;
    typoTargetX = typoX; typoTargetY = typoY;
  } else if (bar4 === 0 && intensity > 0.1) {
    const positions = [
      [0, 0], [0, -0.2], [0, 0.2],
      [-0.15, 0], [0.15, 0], [0, -0.3],
    ];
    const pos = positions[Math.floor(Math.random() * positions.length)];
    typoTargetX = pos[0] * intensity;
    typoTargetY = pos[1] * intensity;
  }
  
  // ── SPREAD FX: spacing explosion ──
  if (fx === 'spread') {
    typoSpread = 1.0; // full burst, decays in render
  }
  
  typoFlash = 1.0;
  typoNextRandom();
}

// Logo image cache
const _logoCache = {};
function getLogoImage(url) {
  if (!url) return null;
  if (_logoCache[url]) {
    const cached = _logoCache[url];
    if (cached._failed) return null; // load failed
    return (cached.complete && cached.naturalWidth > 0) ? cached : null;
  }
  const img = new Image();
  img._failed = false;
  img.onerror = () => { img._failed = true; console.warn('[LOGO] Failed to load:', url); };
  img.onload = () => { console.log('[LOGO] Loaded:', url, img.naturalWidth + 'x' + img.naturalHeight); };
  img.src = url;
  _logoCache[url] = img;
  return null;
}

// ── TYPO placeholder system ──────────────────────────────────────
const TYPO_WORDS_DEFAULT = ['BASS', 'DROP', 'TECHNO', 'OMEN', 'NIGHT', 'ENERGY', 'PULSE', 'MOVE', 'DEEP', 'DARK', 'ACID', 'RAVE', 'LOVE', 'UNITY', 'FLOW', 'HEAT'];
let typoWords = TYPO_WORDS_DEFAULT;
let typoRandomWord = typoWords[0];
let typoRandomIdx = 0;

function typoNextRandom() {
  if (typoWords.length === 0) return;
  typoRandomIdx = (typoRandomIdx + 1) % typoWords.length;
  typoRandomWord = typoWords[typoRandomIdx];
}

// Event config — loaded from localStorage
let typoEventConfig = { dj: '', event: '', schedule: [], words: [] };
try {
  const ec = localStorage.getItem('omen_event');
  if (ec) {
    typoEventConfig = JSON.parse(ec);
    if (typoEventConfig.words && typoEventConfig.words.length > 0) typoWords = typoEventConfig.words;
  }
} catch(e) {}

function getDayString() {
  const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
  const d = new Date();
  const h = d.getHours();
  const day = days[d.getDay()];
  if (h >= 18 || h < 5) return day + ' NIGHT';
  if (h >= 12) return day + ' AFTERNOON';
  return day + ' MORNING';
}

function getCurrentSetDJ() {
  if (!typoEventConfig.schedule || typoEventConfig.schedule.length === 0) return typoEventConfig.dj || '';
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  // Find current set (last one that started)
  let current = typoEventConfig.schedule[0];
  for (const s of typoEventConfig.schedule) {
    const [h, m] = (s.time || '00:00').split(':').map(Number);
    let setMins = h * 60 + m;
    // Handle overnight (if set time < 12:00, assume next day = +1440)
    if (setMins < 720 && mins > 720) setMins += 1440;
    if (setMins <= (mins > 720 ? mins : mins + 1440)) current = s;
  }
  return current.dj || current.name || '';
}

function resolveTypoPlaceholders(text) {
  if (!text || !text.includes('{')) return text;
  
  return text.replace(/\{(\w+)\}/g, (match, key) => {
    switch (key) {
      case 'mood':      return mood || 'AMBIENT';
      case 'energy':    return Math.round((normEnergy || 0) * 100) + '%';
      case 'day':       return getDayString();
      case 'beats':     return String(beatCount);
      case 'random':    return typoRandomWord;
      case 'dj':        return getCurrentSetDJ() || typoEventConfig.dj || 'DJ';
      case 'event':     return typoEventConfig.event || 'ØMEN';
      case 'countdown': {
        if (!typoEventConfig.countdownTo) return '00:00';
        const target = new Date(typoEventConfig.countdownTo).getTime();
        const diff = Math.max(0, target - Date.now());
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      }
      case 'settime': {
        const dj = getCurrentSetDJ();
        const sched = typoEventConfig.schedule || [];
        const entry = sched.find(s => (s.dj || s.name) === dj);
        return entry ? `${dj} ${entry.time || ''}` : dj;
      }
      default: return match;
    }
  });
}

function renderTypo(pal) {
  const preset = PRESETS[activePreset] || {};
  const fx = preset.fx || 'none';
  const [rP, gP, bP] = hexRgb(pal[2]);
  const intensity = driveScale * fxIntensity; // combined animation level
  
  // Easing — speed proportional to intensity
  const easeSpeed = 0.2 + intensity * 0.3; // 0.2 at idle, 0.5 at max
  typoScale += (typoTargetScale - typoScale) * easeSpeed;
  typoX += (typoTargetX - typoX) * easeSpeed;
  typoY += (typoTargetY - typoY) * easeSpeed;
  typoFlash *= (fx === 'strobo') ? 0.93 : 0.82;
  typoSpread *= 0.88; // spread decay
  
  // Background
  const invertActive = fx === 'invert' && typoFlash > 0.15; // was 0.4
  ctx.fillStyle = invertActive ? '#fff' : '#000';
  ctx.fillRect(0, 0, W, H);
  
  const beatPulse = 1.0 + typoFlash * 0.3 * fxIntensity + smoothBass * 0.1 * fxIntensity;
  const tx = CX + typoX * W;
  const ty = CY + typoY * H;
  
  // FX: SHAKE — violent vibration
  let shakeX = 0, shakeY = 0;
  if (fx === 'shake' && typoFlash > 0.05) {
    const shakeAmt = typoFlash * fxIntensity;
    shakeX = (Math.random() - 0.5) * W * 0.08 * shakeAmt;
    shakeY = (Math.random() - 0.5) * H * 0.04 * shakeAmt;
  }
  
  // FX: STROBO — rapid on/off
  const stroboHide = fx === 'strobo' && typoFlash > 0.08 && Math.floor(animTime * 60) % 2 === 0;
  if (stroboHide) { ctx.restore?.(); return; }
  
  // Color
  const flash = typoFlash * 0.7;
  let tr, tg, tb;
  if (invertActive) { tr = tg = tb = 0; }
  else { tr = Math.round(rP + (255 - rP) * flash); tg = Math.round(gP + (255 - gP) * flash); tb = Math.round(bP + (255 - bP) * flash); }
  
  ctx.save();
  ctx.translate(tx + shakeX, ty + shakeY);
  
  // ═══ LOGO MODE ═══
  if (preset.logoUrl) {
    const img = getLogoImage(preset.logoUrl);
    if (img) {
      const logoSize = (preset.logoSize || 40) / 100;
      const scale = typoScale * beatPulse;
      const imgW = Math.min(W * logoSize, img.naturalWidth) * scale;
      const imgH = imgW * (img.naturalHeight / img.naturalWidth);
      
      // Glow
      if (typoFlash > 0.15 && fx !== 'invert') {
        ctx.shadowColor = `rgba(${rP},${gP},${bP},${typoFlash * 0.4})`;
        ctx.shadowBlur = imgW * 0.05 * typoFlash;
      }
      
      // FX: GLITCH on logo — aggressive RGB split
      if (fx === 'glitch' && typoFlash > 0.05) {
        const go = imgW * 0.06 * typoFlash;
        ctx.globalCompositeOperation = 'screen';
        ctx.globalAlpha = 0.6 + typoFlash * 0.3;
        ctx.drawImage(img, -imgW/2 - go, -imgH/2 - go*0.5, imgW, imgH);
        ctx.drawImage(img, -imgW/2 + go, -imgH/2 + go*0.5, imgW, imgH);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }
      
      if (invertActive) { ctx.filter = 'invert(1)'; }
      ctx.drawImage(img, -imgW/2, -imgH/2, imgW, imgH);
      ctx.filter = 'none';
    } else {
      // Loading or failed — show preset name as fallback
      ctx.font = `300 ${Math.min(W, H) * 0.05}px system-ui, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = `rgba(${rP},${gP},${bP},0.3)`;
      ctx.fillText('loading logo...', 0, 0);
    }
    ctx.shadowBlur = 0;
    ctx.restore();
    return;
  }
  
  // ═══ TEXT MODE (multi-line) ═══
  const rawText = preset.text || preset.name || 'ØMEN';
  const text = resolveTypoPlaceholders(rawText);
  const font = preset.font || 'Helvetica Neue';
  const weight = preset.weight || '900';
  const spacing = preset.spacing || 10;
  
  const lines = text.split('\n').filter(l => l.trim());
  const lineCount = Math.max(lines.length, 1);
  
  // Calculate font size per line: widest line fills 90% viewport
  ctx.font = `${weight} 100px '${font}', sans-serif`;
  let maxTextWidth = 1;
  lines.forEach(line => {
    const m = ctx.measureText(line);
    const w = m.width + line.length * spacing;
    if (w > maxTextWidth) maxTextWidth = w;
  });
  const autoSize = (W * 0.90) / (maxTextWidth / 100);
  // Multi-line: shrink to fit all lines vertically
  const maxH = H * 0.75 / lineCount;
  const fontSize = Math.max(Math.min(autoSize, maxH) * typoScale * beatPulse, 10);
  const lineHeight = fontSize * 1.1;
  const totalH = lineHeight * lineCount;
  const startY = -totalH / 2 + lineHeight / 2;
  
  ctx.font = `${weight} ${fontSize.toFixed(0)}px '${font}', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  // Spacing: base + bass breathing (always on) + SPREAD FX burst
  const baseSp = spacing * fontSize / 100;
  const breathSp = smoothBass * 8 * driveScale; // subtle bass breathing
  const spreadSp = typoSpread * fontSize * 0.15; // SPREAD FX: massive burst
  const totalSp = baseSp + breathSp + spreadSp;
  try { ctx.letterSpacing = `${totalSp.toFixed(1)}px`; } catch(e) {}
  
  // Glow — strong burst
  if (typoFlash > 0.05 && fx !== 'invert') {
    ctx.shadowColor = `rgba(${rP},${gP},${bP},${typoFlash * 0.6})`;
    ctx.shadowBlur = fontSize * 0.15 * typoFlash;
  }
  
  // FX: GLITCH — massive RGB split + slice
  if (fx === 'glitch' && typoFlash > 0.05) {
    const go = fontSize * 0.06 * typoFlash; // was 0.015 — 4x bigger
    ctx.globalCompositeOperation = 'screen';
    lines.forEach((line, i) => {
      const ly = startY + i * lineHeight;
      // Horizontal slice offset per line
      const sliceX = (Math.random() - 0.5) * fontSize * 0.1 * typoFlash;
      ctx.fillStyle = `rgba(255,0,0,${0.6 + typoFlash * 0.3})`;
      ctx.fillText(line, -go + sliceX, ly - go * 0.5);
      ctx.fillStyle = `rgba(0,255,255,${0.6 + typoFlash * 0.3})`;
      ctx.fillText(line, go - sliceX, ly + go * 0.5);
    });
    ctx.globalCompositeOperation = 'source-over';
  }
  
  // Main text
  ctx.fillStyle = `rgb(${tr},${tg},${tb})`;
  lines.forEach((line, i) => {
    ctx.fillText(line, 0, startY + i * lineHeight);
  });
  
  ctx.shadowBlur = 0;
  ctx.restore();
}

// ── Data Scope: Concentric FFT waveform rings (Big Data style) ──
function renderDataScope(pal) {
  const minD = Math.min(W, H) * GFX_SCALE;
  const [rP, gP, bP] = hexRgb(pal[2]);
  const [rB, gB, bB] = hexRgb(pal[3]);
  const [rD, gD, bD] = hexRgb(pal[0]);
  
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(compassAngle);
  
  const ringCount = 18;
  const innerR = minD * 0.08;
  const outerR = minD * 0.48 * pulseScale;
  const points = 128; // resolution per ring
  
  for (let ring = 0; ring < ringCount; ring++) {
    const t = ring / (ringCount - 1); // 0→1
    const baseR = innerR + (outerR - innerR) * t;
    
    // Each ring reads different FFT range
    const freqStart = t * 0.6;
    const freqEnd = freqStart + 0.15;
    
    // Color: inner = palette dark/warm, outer = palette bright
    const cr = rD + (rP - rD) * t;
    const cg = gD + (gP - gD) * t;
    const cb = bD + (bP - bD) * t;
    // Outer rings get bright accent
    const ar = ring > ringCount * 0.7 ? rB : cr;
    const ag = ring > ringCount * 0.7 ? gB : cg;
    const ab = ring > ringCount * 0.7 ? bB : cb;
    
    const alpha = 0.15 + t * 0.45 + beatFlash * 0.3;
    
    // Amplitude: outer rings = more displacement
    const ampScale = (0.3 + t * 0.7) * minD * 0.06;
    
    ctx.beginPath();
    for (let i = 0; i <= points; i++) {
      const angle = (i / points) * Math.PI * 2;
      
      // FFT value at this angle
      const fftIdx = Math.floor((i / points) * (freqData ? freqData.length * 0.5 : 64));
      const rawVal = freqData ? freqData[Math.min(fftIdx, freqData.length - 1)] / 255 : 0;
      
      // Sharp/jagged: quantize to steps
      const quantized = Math.floor(rawVal * 6) / 6;
      
      // Displacement outward
      const disp = quantized * ampScale;
      const r = baseR + disp;
      
      const x = Math.cos(angle) * r;
      const y = Math.sin(angle) * r;
      
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = `rgba(${ar|0},${ag|0},${ab|0},${alpha.toFixed(3)})`;
    ctx.lineWidth = ring > ringCount * 0.75 ? 1.5 : 0.8;
    ctx.stroke();
  }
  
  // ── Radial grid lines (subtle, like radar) ──
  ctx.strokeStyle = `rgba(${rP},${gP},${bP},0.06)`;
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 36; i++) {
    const angle = (i / 36) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * innerR, Math.sin(angle) * innerR);
    ctx.lineTo(Math.cos(angle) * outerR * 1.1, Math.sin(angle) * outerR * 1.1);
    ctx.stroke();
  }
  
  // ── Tick marks around outer edge (like compass/protractor) ──
  ctx.strokeStyle = `rgba(${rP},${gP},${bP},0.12)`;
  const tickR = outerR * 1.05;
  for (let i = 0; i < 72; i++) {
    const angle = (i / 72) * Math.PI * 2;
    const len = i % 9 === 0 ? minD * 0.02 : minD * 0.008;
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * tickR, Math.sin(angle) * tickR);
    ctx.lineTo(Math.cos(angle) * (tickR + len), Math.sin(angle) * (tickR + len));
    ctx.stroke();
  }
  
  // ── Center dot ──
  const dotR = 2 + smoothBass * 4 + beatFlash * 6;
  ctx.beginPath();
  ctx.arc(0, 0, dotR, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(${rB},${gB},${bB},${0.3 + beatFlash * 0.7})`;
  ctx.fill();
  
  ctx.restore();
}

// ── Crosshair: Red targeting scope overlay (iOS squareRed port) ──
function renderCrosshair(pal) {
  const minD = Math.min(W, H) * GFX_SCALE;
  const [rP, gP, bP] = hexRgb(pal[2]);
  
  // Base opacity: low idle, bright on beat
  const baseAlpha = 0.25 + smoothVol * 0.3 + beatFlash * 0.4;
  const color = `rgba(${rP},${gP},${bP},${baseAlpha.toFixed(3)})`;
  const colorDim = `rgba(${rP},${gP},${bP},${(baseAlpha * 0.4).toFixed(3)})`;
  
  // Sizes pulse with bass
  const pulse = 1.0 + smoothBass * 0.08;
  const outerW = minD * 0.55 * pulse;
  const outerH = minD * 0.42 * pulse;
  const innerW = minD * 0.32 * pulse;
  const innerH = minD * 0.25 * pulse;
  
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(compassAngle);
  
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = color;
  
  // ── Outer rectangle ──
  ctx.strokeRect(-outerW, -outerH, outerW * 2, outerH * 2);
  
  // ── Inner rectangle ──
  ctx.strokeStyle = colorDim;
  ctx.strokeRect(-innerW, -innerH, innerW * 2, innerH * 2);
  
  // ── Center cross (extends beyond outer rect) ──
  const crossExtend = minD * 0.65;
  ctx.strokeStyle = color;
  ctx.lineWidth = 0.8;
  
  // Vertical line
  ctx.beginPath();
  ctx.moveTo(0, -crossExtend);
  ctx.lineTo(0, crossExtend);
  ctx.stroke();
  
  // Horizontal line
  ctx.beginPath();
  ctx.moveTo(-crossExtend, 0);
  ctx.lineTo(crossExtend, 0);
  ctx.stroke();
  
  // ── Tick marks at intersections ──
  const tickSize = minD * 0.015;
  ctx.lineWidth = 1.0;
  ctx.strokeStyle = color;
  
  // Ticks on outer rect (where cross meets edges)
  const outerTicks = [
    [0, -outerH], [0, outerH],       // top, bottom center
    [-outerW, 0], [outerW, 0],       // left, right center
  ];
  outerTicks.forEach(([tx, ty]) => {
    ctx.beginPath();
    ctx.moveTo(tx - tickSize, ty);
    ctx.lineTo(tx + tickSize, ty);
    ctx.moveTo(tx, ty - tickSize);
    ctx.lineTo(tx, ty + tickSize);
    ctx.stroke();
  });
  
  // Ticks on inner rect
  const innerTicks = [
    [0, -innerH], [0, innerH],
    [-innerW, 0], [innerW, 0],
  ];
  innerTicks.forEach(([tx, ty]) => {
    ctx.beginPath();
    ctx.moveTo(tx - tickSize, ty);
    ctx.lineTo(tx + tickSize, ty);
    ctx.moveTo(tx, ty - tickSize);
    ctx.lineTo(tx, ty + tickSize);
    ctx.stroke();
  });
  
  // ── Corner dots on outer rect (4 corners) ──
  const dotR = 2 + beatFlash * 4;
  const corners = [
    [-outerW, -outerH], [outerW, -outerH],
    [-outerW, outerH], [outerW, outerH],
  ];
  corners.forEach(([cx, cy]) => {
    ctx.beginPath();
    ctx.arc(cx, cy, dotR, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  });
  
  // ── Center dot ──
  const centerDot = 2 + smoothBass * 5 + beatFlash * 8;
  ctx.beginPath();
  ctx.arc(0, 0, centerDot, 0, Math.PI * 2);
  ctx.fillStyle = beatFlash > 0.1 ? pal[2] : color;
  ctx.fill();
  
  ctx.restore();
}

function renderVideoRings(pal) {
  const minD = Math.min(W, H) * GFX_SCALE;
  const [rP, gP, bP] = hexRgb(pal[2]);
  const [rB, gB, bB] = hexRgb(pal[3]);
  
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(compassAngle);
  
  // ── Outer ring (64 bars, bass reactive) ─────────────────────
  const outerR = minD * 0.35 * (1 + smoothBass * 0.15) * pulseScale;
  for (let i = 0; i < 64; i++) {
    const angle = (i / 64) * Math.PI * 2;
    const val = getMirroredFft(i, 64, 0, 0.3);
    const barLen = val * outerR * 0.5 + 2;
    const alpha = 0.15 + val * 0.6;
    
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * outerR, Math.sin(angle) * outerR);
    ctx.lineTo(Math.cos(angle) * (outerR + barLen), Math.sin(angle) * (outerR + barLen));
    ctx.strokeStyle = `rgba(${rP},${gP},${bP},${alpha})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  
  // ── Mid ring (48 bars) ──────────────────────────────────────
  const midR = minD * 0.22 * (1 + smoothMid * 0.1);
  for (let i = 0; i < 48; i++) {
    const angle = (i / 48) * Math.PI * 2 + 0.03;
    const val = getMirroredFft(i, 48, 0.15, 0.45);
    const barLen = val * midR * 0.35 + 1;
    const alpha = 0.08 + val * 0.4;
    
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * midR, Math.sin(angle) * midR);
    ctx.lineTo(Math.cos(angle) * (midR + barLen), Math.sin(angle) * (midR + barLen));
    ctx.strokeStyle = `rgba(${rB},${gB},${bB},${alpha})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  
  // ── Inner ring circle ───────────────────────────────────────
  const innerR = minD * 0.10 * (1 + smoothHigh * 0.15);
  ctx.beginPath();
  ctx.arc(0, 0, innerR, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(${rB},${gB},${bB},0.19)`;
  ctx.lineWidth = 0.5;
  ctx.stroke();
  
  // ── Center dot ──────────────────────────────────────────────
  const dotR = 3 + smoothBass * 8 + beatFlash * 15;
  ctx.beginPath();
  ctx.arc(0, 0, dotR, 0, Math.PI * 2);
  ctx.fillStyle = beatFlash > 0.1 ? pal[2] : `rgba(${rB},${gB},${bB},0.38)`;
  ctx.fill();
  
  ctx.restore();
}

// ── Beat Circles: Segmented beat-reveal rings (iOS OMEN4 port) ──
function renderBeatCircles(pal) {
  const minD = Math.min(W, H) * GFX_SCALE;
  const [rP, gP, bP] = hexRgb(pal[2]);
  const bar8 = beatIndex % 8;
  const redOpacity = (0.10 + smoothBass * 0.90);
  
  // Beat reveal: 8 elements, reset every 8 beats
  // Beats 0-3 → small circle segments, beats 4-7 → medium circle segments
  const smallActive = bar8 < 4 ? bar8 + 1 : 4;
  const mediumActive = bar8 >= 4 ? bar8 - 3 : 0;
  
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(compassAngle);
  
  const rLarge = minD * 0.431 * pulseScale;
  const rMedium = minD * 0.350;
  const rSmall = minD * 0.290;
  
  // Bass-reactive stroke width
  const baseStroke = 2 + smoothBass * 14;
  
  // Large circle — always full, bass reactive
  drawSegmentedCircle(rLarge, 4, baseStroke, `rgba(${rP},${gP},${bP},${redOpacity})`, `rgba(${rP},${gP},${bP},0.18)`);
  
  // Medium circle — beat reveal
  drawSegmentedCircle(rMedium, mediumActive, baseStroke * 4, `rgba(${rP},${gP},${bP},${redOpacity})`, `rgba(${rP},${gP},${bP},0.18)`);
  
  // Small circle — beat reveal
  drawSegmentedCircle(rSmall, smallActive, baseStroke * 4, `rgba(${rP},${gP},${bP},${redOpacity})`, `rgba(${rP},${gP},${bP},0.18)`);
  
  ctx.restore();
}

function drawSegmentedCircle(radius, activeCount, strokeW, activeColor, ghostColor) {
  const gapAngle = 10 / radius;
  const segAngle = (Math.PI * 2 - 4 * gapAngle) / 4;
  
  for (let i = 0; i < 4; i++) {
    const startAngle = i * (segAngle + gapAngle) - Math.PI / 2;
    ctx.beginPath();
    ctx.arc(0, 0, radius, startAngle, startAngle + segAngle);
    ctx.strokeStyle = i < activeCount ? activeColor : ghostColor;
    ctx.lineWidth = strokeW;
    ctx.lineCap = 'butt';
    ctx.stroke();
  }
}

// ── Dot Matrix: Dotted ring columns (iOS OMEN5 port) ────────────
function renderDotMatrix(pal) {
  const minD = Math.min(W, H) * GFX_SCALE;
  const [rP, gP, bP] = hexRgb(pal[2]);
  const [rB, gB, bB] = hexRgb(pal[3]);
  const bar8 = beatIndex % 8;
  
  // Beat boost on bar8
  const beatBoost = (bar8 === 0) ? 1.8 : (bar8 % 4 === 0 ? 1.3 : 1.0);
  
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(compassAngle);
  
  // ── Outer dotted ring (4 rows of dots) ──────────────────────
  const outerDotR = minD * 0.50 * pulseScale;
  const outerCount = 100;
  
  for (let i = 0; i < outerCount; i++) {
    const angle = (i / outerCount) * Math.PI * 2 - Math.PI / 2;
    const val = Math.min(getMirroredFft(i, outerCount, 0, 0.4) * beatBoost, 1.0);
    const baseVal = 0.08 * beatBoost;
    
    for (let d = 0; d < 4; d++) {
      const r = outerDotR + d * (minD * 0.028);
      const dotSize = minD * 0.005 * (1.0 - d * 0.15) * Math.min(beatBoost, 1.5);
      const threshold = d * 0.20;
      const effectiveVal = val > threshold ? val : baseVal;
      const opacity = Math.min(Math.max(effectiveVal * (1.0 - d * 0.18), 0.04), 1.0);
      
      const lc = lerpColor(pal[2], pal[3], effectiveVal);
      ctx.beginPath();
      ctx.arc(Math.cos(angle) * r, Math.sin(angle) * r, dotSize, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${lc[0]|0},${lc[1]|0},${lc[2]|0},${opacity})`;
      ctx.fill();
    }
  }
  
  // ── Inner dotted ring (column dots, high freq) ──────────────
  const innerDotR = minD * 0.40;
  const innerCount = 100;
  
  for (let i = 0; i < innerCount; i++) {
    const angle = (i / innerCount) * Math.PI * 2 - Math.PI / 2;
    const val = getMirroredFft(i, innerCount, 0.4, 0.7);
    if (val < 0.02) continue;
    
    const dots = Math.min(Math.ceil(val * 6), 6);
    for (let d = 0; d < dots; d++) {
      const r = innerDotR + d * (minD * 0.025);
      const dotSize = minD * 0.006 * (1.0 - d * 0.25);
      const opacity = Math.min(Math.max(0.9 - d * 0.15, 0.1), 1.0);
      
      const lc = lerpColor(pal[2], pal[3], val);
      ctx.beginPath();
      ctx.arc(Math.cos(angle) * r, Math.sin(angle) * r, dotSize, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${lc[0]|0},${lc[1]|0},${lc[2]|0},${opacity})`;
      ctx.fill();
    }
  }
  
  // ── Center beat dot ─────────────────────────────────────────
  const dotR = 3 + smoothBass * 8 + beatFlash * 15;
  ctx.beginPath();
  ctx.arc(0, 0, dotR, 0, Math.PI * 2);
  ctx.fillStyle = beatFlash > 0.1 ? pal[2] : `rgba(${rB},${gB},${bB},0.38)`;
  ctx.fill();
  
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
// Main Loop
// ═══════════════════════════════════════════════════════════════

let beatCount = 0;

function tick() {
  try {
    analyseAudio();
    
    // Beat detection — skip if CDJ bridge provides beats
    if (!cdjConnected) {
      const beat = detectBeat();
      if (!beatClockTimer) {
        if (beat) {
          beatFlash = 1.0 * fxIntensity;
          pulseScale = 1.0 + 0.25 * driveScale + smoothBass * 0.3 * driveScale;
          beatCount++;
          moodBeatCounter++;
          if (PRESETS[activePreset]?.type === 'camera') {
            camPulseScale = 1.0;
          }
          // Strobo on raw beat
          if (stroboActive) { stroboBeatToggle = !stroboBeatToggle; stroboFlash = stroboBeatToggle ? stroboEnvelope : 0; }
          // TYPO: fire FX on raw beat
          typoFlash = 1.0;
          beatIndex++;
          typoOnBeat();
          updatePhraseOnBeat();
        }
      } else {
        if (beat) autoCorrectBpm();
      }
    }
    
    updateEnergy();
    updateSilenceDampen();
    
    // Phrase detection: audio-side (runs every frame, even during CDJ breakdown)
    updatePhraseAudio();
    
    updateAutopilot();
    
    // THEME ENFORCEMENT: only during autopilot/beatcut
    if (autopilotEnabled || beatCutEnabled) {
      _themeCheckCounter++;
      if (_themeCheckCounter >= 30) {
        _themeCheckCounter = 0;
        const _p = PRESETS[activePreset];
        const _t = getPresetTheme(_p);
        if (!activeThemes[_t]) {
          const _allowed = getActiveThemePresets();
          if (_allowed.length > 0) {
            const _pick = _allowed[Math.floor(Math.random() * _allowed.length)];
            activePreset = _pick.idx;
            updateVideoVisibility();
            updatePresetGrid();
          }
        }
      }
    }
    
    updateVideoLayer();
    render();
    
    // Update HUD
    const bpmEl = document.getElementById('bpmDisplay');
    if (bpmEl) bpmEl.textContent = bpm > 0 ? bpm.toFixed(1) + ' BPM' : '— BPM';
    const eFill = document.getElementById('energyFill');
    if (eFill) eFill.style.width = (normEnergy * 100).toFixed(0) + '%';
    const moodEl = document.getElementById('moodDisplay');
    if (moodEl) moodEl.textContent = mood;
    const dbg = document.getElementById('debugDisplay');
    if (dbg) {
      const cdjInfo = cdjConnected ? ` CDJ:${cdjBarBeat}/4 bar:${Math.floor((cdjBeatTotal-1)/4)%4+1}/4` : '';
      const phraseInfo = phraseState !== 'NORMAL' ? ` [${phraseState}]` : ` P:${phraseCounter}`;
      const flags = `AP:${autopilotEnabled?'1':'0'} BC:${beatCutEnabled?'1':'0'} E:${autoEnergyEnabled?'1':'0'} ABC:${autoBeatCutEnabled?'1':'0'}`;
      dbg.textContent = `${PRESETS[activePreset]?.name||'?'} | ${mood} D:${masterDrive}% cut:${beatCutInterval} ${flags}${phraseInfo}${cdjInfo}`;
    }
    
    // Beat dots — synced to phrase (not arbitrary beatIndex)
    const pos16 = phraseCounter % 16;
    for (let i = 0; i < 16; i++) {
      const dot = document.getElementById('bd' + i);
      if (!dot) continue;
      if (i === pos16 && beatFlash > 0.3) {
        // Current beat: downbeats (0,4,8,12) = RED, others = white
        dot.className = 'bdot ' + (i % 4 === 0 ? 'downbeat' : 'on');
      } else if (i < pos16) {
        // Passed beats: dim trail
        dot.className = 'bdot';
        dot.style.background = 'rgba(255,255,255,0.15)';
      } else {
        dot.className = 'bdot';
        dot.style.background = '';
      }
    }
  } catch (err) {
    console.error('tick error:', err);
  }
  
  // ALWAYS schedule next frame + broadcast, even if tick errored
  requestAnimationFrame(tick);
  broadcastState();
}

function toggleBeatCut() {
  beatCutEnabled = !beatCutEnabled;
  beatCutSequenceIdx = 0;
  // Manual toggle → sync autopilot flag so it doesn't fight
  if (!beatCutEnabled) autoBeatCutEnabled = false;
  if (beatCutEnabled) {
    beatCutWaitForDownbeat = cdjConnected;
    beatCutCountdown = beatCutInterval;
    beatCutActive = new Set(PRESETS.map((_, i) => i).filter(i => presetReady[i] && presetPool.has(i)));
  }
  updatePresetGrid();
}

function setBeatCutInterval(n) {
  beatCutInterval = n;
  beatCutCountdown = Math.min(beatCutCountdown, n); // don't wait longer than new interval
  updatePresetGrid();
}

function handleColorClick(idx) {
  if (autopilotEnabled && autoColorEnabled) {
    // Toggle color in/out of pool
    if (colorPool.has(idx)) {
      if (colorPool.size > 1) colorPool.delete(idx);
    } else {
      colorPool.add(idx);
    }
  } else {
    // Manual: instant switch
    colorIndex = idx;
    applyVideoColor();
  }
  updateColorDots();
}

function setColor(idx) {
  colorIndex = idx;
  applyVideoColor();
  updateColorDots();
}

function updateColorDots() {
  for (let i = 0; i < 5; i++) {
    const el = document.getElementById('cd' + i);
    if (!el) continue;
    if (autopilotEnabled && autoColorEnabled) {
      // Pool mode: bright = in pool, dim = excluded, ring = current
      const inPool = colorPool.has(i);
      const isCurrent = i === colorIndex;
      el.className = 'cdot' + (isCurrent ? ' active' : '') + (!inPool ? ' excluded' : '');
    } else {
      el.className = 'cdot' + (i === colorIndex ? ' active' : '');
    }
  }
}

function toggleStrobo() {
  stroboActive = !stroboActive;
  manualStrobo = stroboActive;
  stroboEnvelope = 0.85 * driveScale; // manual strobo scaled by drive
  document.getElementById('strbBtn').className = 'pgrid' + (stroboActive ? ' cut-on' : '');
}

let videoHidden = false;
function toggleVideoHide() {
  videoHidden = !videoHidden;
  document.getElementById('videoLayer').style.opacity = videoHidden ? '0' : '1';
  document.getElementById('vhidBtn').className = 'pgrid' + (videoHidden ? ' cut-on' : '');
}

function setVideoSpeed(mult) {
  videoSpeedMultiplier = mult;
  if (bpm > 0) updateVideoSpeed(bpm);
  ['05', '10', '20'].forEach(id => {
    const el = document.getElementById('spd' + id);

// ═══════════════════════════════════════════════════════════════
// Video Color Filter (iOS: ColorFilter.mode hue blend)
// ═══════════════════════════════════════════════════════════════

function applyVideoColor() {
  const layer = document.getElementById('videoLayer');
  if (!layer) return;
  if (colorIndex === 4) {
    layer.style.filter = 'saturate(0)';
  } else if (colorIndex === 0) {
    layer.style.filter = 'none';
  } else {
    const hueMap = [0, 220, 120, 50, 0];
    layer.style.filter = `hue-rotate(${hueMap[colorIndex]}deg)`;
  }
}

// ═══════════════════════════════════════════════════════════════
// Pinch / Wheel Zoom (iOS: _onPinchUpdate → _scaleBoost)
// ═══════════════════════════════════════════════════════════════

let pinchScale = 1.0;

document.addEventListener('wheel', (e) => {
  if (!audioCtx) return; // not started yet
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.05 : 0.05;
  pinchScale = Math.min(Math.max(pinchScale + delta, 0.3), 4.0);
}, { passive: false });

// Touch pinch
let pinchStartDist = 0;
let pinchBaseScale = 1.0;

document.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.sqrt(dx * dx + dy * dy);
    pinchBaseScale = pinchScale;
  }
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    pinchScale = Math.min(Math.max(pinchBaseScale * (dist / pinchStartDist), 0.3), 4.0);
  }
}, { passive: true });

// ═══════════════════════════════════════════════════════════════
// Keyboard controls
// ═══════════════════════════════════════════════════════════════

let hudVisible = true;

document.addEventListener('keydown', (e) => {
  // S key on setup screen → system audio
  if (e.code === 'KeyS' && !document.getElementById('setup').classList.contains('hidden')) {
    e.preventDefault();
    startAudio('system');
    return;
  }
  switch (e.code) {
    case 'Space':
      e.preventDefault();
      handleTap();
      break;
    case 'KeyF':
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
      break;
    case 'KeyH':
      hudVisible = !hudVisible;
      document.getElementById('hud').classList.toggle('hidden');
      document.getElementById('controls-hint').classList.toggle('hidden');
      break;
    case 'KeyC':
      colorIndex = (colorIndex + 1) % palettes.length;
      applyVideoColor();
      updateColorDots();
      break;
    case 'KeyV':
      toggleVideoHide();
      break;
    case 'KeyS':
      toggleStrobo();
      break;
    case 'KeyB':
      toggleBeatCut();
      break;
    case 'Digit2':
      setBeatCutInterval(2);
      break;
    case 'Digit4':
      setBeatCutInterval(4);
      break;
    case 'Digit8':
      setBeatCutInterval(8);
      updatePresetGrid();
      break;
    case 'Digit1': case 'Digit3':
      // Manual preset switch: 1=OMEN2, 3=OMEN4
      if (e.code === 'Digit1' && presetReady[0]) switchToPreset(0);
      if (e.code === 'Digit3' && presetReady[2]) switchToPreset(2);
      break;
    case 'KeyQ':
      handlePresetClick(0);
      break;
    case 'KeyW':
      handlePresetClick(1);
      break;
    case 'KeyE':
      handlePresetClick(2);
      break;
    case 'Escape':
      document.getElementById('setup').classList.remove('hidden');
      document.getElementById('hud').classList.add('hidden');
      document.getElementById('controls-hint').classList.add('hidden');
      break;
  }
});

// Tap on mobile/desktop — click anywhere except HUD
document.body.addEventListener('click', (e) => {
  if (!audioCtx) return;
  // Don't tap if clicking HUD controls
  if (e.target.closest('#hud, #setup, #controls-hint')) return;
  handleTap();
});

// ═══════════════════════════════════════════════════════════════
// CDJ / ProLink Bridge (WebSocket → ws://localhost:9000)
// ═══════════════════════════════════════════════════════════════

let cdjConnected = false;
let audioSourceName = '';
let availableAudioDevices = [];
let cdjBarBeat = 0;        // 1-4 from CDJ (0 = no CDJ)
let cdjDownbeatCount = 0;  // counts downbeats since beat cut enabled
let cdjBeatTotal = 0;      // running beat total from CDJ
let beatCutWaitForDownbeat = false; // true = waiting to sync to downbeat
let cdjWs = null;
let cdjBpm = 0;
let cdjLastBeat = 0;
let cdjTrackTitle = '';

// Remote camera from mobile controller
let remoteCamActive = false;
let remoteCamCanvas = null;
let remoteCamCtx = null;
let remoteCamImg = null;
let remoteCamFrameCount = 0;

// Camera animation
let camPulseBeat = 0;
let camPulseScale = 0;
let camRotCurrent = 0;
let camRotTarget = 0;

// Local cameras (USB webcam etc. on player PC)
const localCams = {}; // presetIdx → { stream, videoEl }
let localCamPickerOpen = false;

function connectCDJ() {
  try {
    cdjWs = new WebSocket('ws://localhost:9000');
    
    cdjWs.onopen = () => {
      cdjConnected = true;
      // Kill TAP BPM timer — CDJ is now the beat source
      if (beatClockTimer) { clearInterval(beatClockTimer); beatClockTimer = null; }
      console.log('[CDJ] Bridge connected — TAP BPM timer killed');
    };
    
    cdjWs.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        
        if (msg.type === 'cdj_beat') {
          cdjBpm = msg.bpm;
          bpm = Math.round(msg.bpm * 10) / 10;
          
          // CDJ bar position (1-4)
          const barBeat = msg.beatInMeasure || 1;
          cdjBarBeat = barBeat;
          cdjBeatTotal = msg.beatTotal || cdjBeatTotal + 1;
          beatIndex++;
          beatCount++;
          moodBeatCounter++;
          if (camHoldBeats > 0) camHoldBeats--;
          beatFiredFrames = 5;
          
          const isDownbeat = barBeat === 1;
          
          // Downbeat counter (reset when beat cut enabled)
          if (isDownbeat) cdjDownbeatCount++;
          
          // Bar number from CDJ beatTotal (phrase tracking)
          const barNumber = Math.floor((cdjBeatTotal - 1) / 4);
          const phraseBar = barNumber % 4;  // 0,1,2,3 within 4-bar phrase
          const isPhrase4 = isDownbeat && phraseBar === 0;  // start of 4-bar phrase
          const isPhrase2 = isDownbeat && phraseBar % 2 === 0; // start of 2-bar phrase
          
          // FX hierarchy — CDJ phrase-aware
          const ds = driveScale;
          if (isPhrase4) {
            // Beat 1 of 4-bar phrase = STRONGEST
            beatFlash = 1.0 * fxIntensity;
            exposureOpacity = 0.4 * fxIntensity;
            pulseScale = 1.0 + 0.35 * ds + smoothBass * 0.4 * ds;
          } else if (isPhrase2) {
            // Beat 1 of 2-bar phrase
            beatFlash = 0.85 * fxIntensity;
            exposureOpacity = 0.25 * fxIntensity;
            pulseScale = 1.0 + 0.30 * ds + smoothBass * 0.35 * ds;
          } else if (isDownbeat) {
            // Regular downbeat
            beatFlash = 0.65 * fxIntensity;
            exposureOpacity = 0.12 * fxIntensity;
            pulseScale = 1.0 + 0.20 * ds + smoothBass * 0.25 * ds;
          } else if (barBeat === 3) {
            // Backbeat
            beatFlash = 0.3 * fxIntensity;
            pulseScale = 1.0 + 0.10 * ds + smoothBass * 0.12 * ds;
          } else {
            // Beats 2, 4
            pulseScale = 1.0 + 0.04 * ds + smoothBass * 0.08 * ds;
          }
          
          // Strobo
          if (stroboActive) { stroboBeatToggle = !stroboBeatToggle; stroboFlash = stroboBeatToggle ? stroboEnvelope : 0; } else { if (stroboFlash > 0.01) stroboFlash *= 0.65; else stroboFlash = 0; }
          
          // Video speed sync
          if (videoLoaded) updateVideoSpeed(bpm);
          
          // Phrase detection — BEFORE beat cut (may reset countdown)
          updatePhraseOnBeat();
          
          // Beat cut — PHRASE-ALIGNED (matches local beat clock)
          if (beatCutEnabled && beatCutInterval >= 1) {
            if (beatCutWaitForDownbeat) {
              if (isDownbeat) {
                beatCutWaitForDownbeat = false;
                cdjDownbeatCount = 0;
              }
            } else {
              const effectiveInterval = Math.floor(getOrganicInterval());
              if (phraseCounter > 0 && phraseCounter % effectiveInterval === 0) {
                beatCutNext();
              }
            }
          }
          // Sub-beat (interval < 1)
          if (beatCutEnabled && beatCutInterval < 1 && beatCutInterval > 0) {
            scheduleSubBeatCuts();
          }
          
          // TYPO FX on CDJ beat
          typoFlash = 1.0;
          typoOnBeat();
        }
        
        else if (msg.type === 'cdj_status') {
          if (msg.isMaster || cdjBpm === 0) {
            cdjBpm = msg.bpm;
            bpm = Math.round(msg.bpm * 10) / 10;
          }
        }
        
        else if (msg.type === 'cdj_track') {
          cdjTrackTitle = msg.title || '';
          console.log(`[CDJ] Track: ${msg.artist} - ${msg.title} (${msg.bpm} BPM)`);
        }
        
      } catch (err) {
        // ignore parse errors
      }
    };
    
    cdjWs.onclose = () => {
      cdjConnected = false;
      console.log('[CDJ] Bridge disconnected, retrying in 3s...');
      setTimeout(connectCDJ, 3000);
    };
    
    cdjWs.onerror = () => {
      cdjConnected = false;
      cdjWs.close();
    };
    
  } catch (err) {
    // WebSocket not available, retry
    setTimeout(connectCDJ, 5000);
  }
}

// Auto-connect on page load (silent if bridge not running)
connectCDJ();
applyDrive(masterDrive); // initialize drive state

// ═══════════════════════════════════════════════════════════════
// Communication — BroadcastChannel (local) + WebSocket (remote)
// ═══════════════════════════════════════════════════════════════

const RELAY_URL = 'https://omen-relay.sony-vega.workers.dev';
const omenChannel = new BroadcastChannel('omen');
let controllerConnected = false;
let relayWs = null;
let relaySessionId = '';
let relayPin = '';

// ── Shared command handler (from BC or WS) ────────────────────
function handleCommand(msg) {
  if (!msg || !msg.type) return;
  controllerConnected = true;
  
  switch (msg.type) {
    case 'presets_updated': {
      // Hot-reload from editor — rebuild PRESETS without page refresh
      const oldLen = PRESETS.length;
      loadPresets();
      // Rebuild arrays to match new length
      const newReady = new Array(PRESETS.length).fill(false);
      presetReady.forEach((v, i) => { if (i < newReady.length) newReady[i] = v; });
      // Mark non-video presets (GFX/camera/text) as ready
      PRESETS.forEach((p, i) => { if (!p.videoA || p.type === 'camera' || p.type === 'text') newReady[i] = true; });
      presetReady = newReady;
      // Preserve existing pool state — only add NEW presets
      const oldPool = new Set(presetPool);
      const oldBeatCut = new Set(beatCutActive);
      presetPool = new Set();
      beatCutActive = new Set();
      PRESETS.forEach((_, i) => {
        if (i < oldLen) {
          // Existing preset — keep old state
          if (oldPool.has(i)) presetPool.add(i);
          if (oldBeatCut.has(i)) beatCutActive.add(i);
        } else {
          // New preset — enabled by default
          presetPool.add(i);
          beatCutActive.add(i);
        }
      });
      // Clamp active preset
      if (activePreset >= PRESETS.length) activePreset = 0;
      _lastActivePreset = -1; // force visibility rebuild
      updateVideoVisibility();
      updatePresetGrid();
      console.log('[HOT-RELOAD] Presets updated:', oldLen, '→', PRESETS.length);
      break;
    }
    case 'event_updated': {
      try {
        const ec = localStorage.getItem('omen_event');
        if (ec) {
          typoEventConfig = JSON.parse(ec);
          if (typoEventConfig.words && typoEventConfig.words.length > 0) {
            typoWords = typoEventConfig.words;
          } else {
            typoWords = TYPO_WORDS_DEFAULT;
          }
          typoRandomIdx = 0;
          typoRandomWord = typoWords[0];
        }
        console.log('[HOT-RELOAD] Event config updated:', typoEventConfig.event, 'words:', typoWords.length);
      } catch(e) {}
      break;
    }
    case 'ping': {
      if (PRESETS.length === 0) break;
      document.getElementById('hud').classList.add('hidden');
      document.getElementById('controls-hint').classList.add('hidden');
      
      // Reply on both channels
      const pong = { type: 'pong', presets: PRESETS.map(p => p.name), scenes: PRESETS.map(p => ({ name: p.name, themeId: p.themeId || 'omen', type: p.type || 'video' })) };
      omenChannel.postMessage(pong);
      if (relayWs && relayWs.readyState === 1) relayWs.send(JSON.stringify(pong));
      break;
    }
    case 'tap':
      handleTap();
      break;
    case 'preset':
      handlePresetClick(msg.idx);
      break;
    case 'beatcut':
      if (msg.enabled !== undefined) {
        beatCutEnabled = msg.enabled;
        beatCutSequenceIdx = 0;
        // Manual OFF → stop autopilot from re-enabling
        if (!msg.enabled) autoBeatCutEnabled = false;
        if (msg.enabled) {
          beatCutWaitForDownbeat = cdjConnected;
          beatCutCountdown = beatCutInterval;
        }
      }
      if (msg.interval) {
        beatCutInterval = msg.interval;
        beatCutCountdown = Math.min(beatCutCountdown, msg.interval);
      }
      if (beatCutEnabled && msg.togglePreset !== undefined) {
        if (beatCutActive.has(msg.togglePreset)) {
          if (beatCutActive.size > 1) beatCutActive.delete(msg.togglePreset);
        } else {
          beatCutActive.add(msg.togglePreset);
        }
      }
      updatePresetGrid();
      break;
    case 'color':
      handleColorClick(msg.idx);
      break;
    case 'strobo':
      toggleStrobo();
      break;
    case 'videohide':
      toggleVideoHide();
      break;
    case 'hudtoggle':
      document.getElementById('hud').classList.toggle('hidden');
      document.getElementById('controls-hint').classList.toggle('hidden');
      break;
    case 'speed':
      setVideoSpeed(msg.value);
      break;
    case 'fx':
      fxSliderValue = msg.value;
      break;
    case 'pinch':
      pinchScale = msg.value;
      break;
    case 'autopilot':
      autopilotEnabled = !autopilotEnabled;
      if (autopilotEnabled) {
        autoEnergyEnabled = true;
        autoFxEnabled = true;
        // autoBeatCutEnabled NOT auto-enabled — user must check it manually
        autoStroboEnabled = true;
        autoColorEnabled = true;
        autoSpeedEnabled = true;
        lastAutopilotMood = '';
      } else {
        // Clean state: autopilot OFF → stop auto beat cut + strobo
        if (autoBeatCutEnabled) { beatCutEnabled = false; }
        if (autoStroboEnabled && !manualStrobo) { stroboActive = false; stroboFlash = 0; }
        autoEnergyEnabled = false;
        autoFxEnabled = false;
        autoBeatCutEnabled = false;
        autoStroboEnabled = false;
        autoColorEnabled = false;
        autoSpeedEnabled = false;
        updatePresetGrid();
      }
      break;
    case 'drive':
      applyDrive(msg.value ?? 70);
      break;
    case 'autofeature':
      if (msg.feature === 'energy') autoEnergyEnabled = !autoEnergyEnabled;
      if (msg.feature === 'fx') autoFxEnabled = !autoFxEnabled;
      if (msg.feature === 'beatcut') {
        autoBeatCutEnabled = !autoBeatCutEnabled;
        if (!autoBeatCutEnabled) { beatCutEnabled = false; updatePresetGrid(); }
      }
      if (msg.feature === 'strobo') {
        autoStroboEnabled = !autoStroboEnabled;
        if (!autoStroboEnabled && !manualStrobo) { stroboActive = false; stroboFlash = 0; }
      }
      if (msg.feature === 'color') autoColorEnabled = !autoColorEnabled;
      if (msg.feature === 'speed') autoSpeedEnabled = !autoSpeedEnabled;
      if (msg.feature === 'videojump') videoJumpEnabled = !videoJumpEnabled;
      autopilotEnabled = autoEnergyEnabled || autoFxEnabled || autoBeatCutEnabled || autoStroboEnabled || autoColorEnabled || autoSpeedEnabled;
      break;
    case 'thememix': {
      if (msg.themes) activeThemes = msg.themes;
      if (msg.weights) themeWeights = msg.weights;
      // Force switch only during autopilot/beatcut
      if (autopilotEnabled || beatCutEnabled) {
        const p2 = PRESETS[activePreset];
        const curTheme2 = getPresetTheme(p2);
        if (!activeThemes[curTheme2]) {
          const allowed = getActiveThemePresets();
          if (allowed.length > 0) {
            const pick = weightedPresetPick(allowed.filter(x => x.idx !== activePreset)) || allowed[0];
            if (pick) {
              activePreset = pick.idx;
              updateVideoVisibility();
              updatePresetGrid();
            }
          }
        }
      }
      break;
    }
    case 'cam_start':
      remoteCamActive = true;
      remoteCamFrameCount = 0;
      remoteCamCanvas = document.getElementById('cameraLayer');
      if (remoteCamCanvas) {
        remoteCamCtx = remoteCamCanvas.getContext('2d');
        remoteCamCanvas.width = msg.width || 480;
        remoteCamCanvas.height = msg.height || 480;
      }
      console.log('[CAM] Remote camera started');
      break;
    case 'cam_stop':
      remoteCamActive = false;
      remoteCamFrameCount = 0;
      const camEl2 = document.getElementById('cameraLayer');
      if (camEl2) camEl2.style.display = 'none';
      console.log('[CAM] Remote camera stopped');
      break;
    case 'cam_frame':
      // Auto-activate on first frame (in case cam_start was missed)
      if (!remoteCamActive) {
        remoteCamActive = true;
        console.log('[CAM] Auto-activated from frame');
      }
      if (!remoteCamCanvas) {
        remoteCamCanvas = document.getElementById('cameraLayer');
        if (!remoteCamCanvas) break;
        remoteCamCtx = remoteCamCanvas.getContext('2d');
        remoteCamCanvas.width = 480;
        remoteCamCanvas.height = 480;
      }
      remoteCamFrameCount++;
      if (!remoteCamImg) remoteCamImg = new Image();
      remoteCamImg.onload = () => {
        if (remoteCamCtx) remoteCamCtx.drawImage(remoteCamImg, 0, 0, remoteCamCanvas.width, remoteCamCanvas.height);
      };
      remoteCamImg.src = 'data:image/jpeg;base64,' + msg.data;
      break;
    case 'cam_select':
      // Controller selected a local camera for a preset
      if (msg.presetIdx !== undefined && msg.deviceId) {
        // Close existing cam for this preset
        if (localCams[msg.presetIdx]) {
          localCams[msg.presetIdx].stream.getTracks().forEach(t => t.stop());
          localCams[msg.presetIdx].videoEl.remove();
          delete localCams[msg.presetIdx];
        }
        openLocalCam(msg.presetIdx, msg.deviceId);
      }
      break;
    case 'audio':
      // Controller requests audio source change
      startAudio(msg.source, msg.deviceId);
      break;
  }
}

// ── BroadcastChannel (same device) ────────────────────────────
omenChannel.onmessage = (e) => {
  try { handleCommand(e.data); } catch (err) { console.error('BC error:', err); }
};

// ── WebSocket Relay (remote mobile) ───────────────────────────
async function initRelay() {
  try {
    // Create session → get PIN
    const resp = await fetch(RELAY_URL + '/session/create', { method: 'POST' });
    if (!resp.ok) { console.warn('[RELAY] Create failed:', resp.status); return; }
    const data = await resp.json();
    relayPin = data.pin;
    relaySessionId = data.sessionId;
    
    // Show PIN
    document.getElementById('pinCode').textContent = relayPin;
    document.getElementById('pinDisplay').style.display = 'block';
    console.log('[RELAY] Session PIN:', relayPin);
    
    // Connect WebSocket as player
    connectRelay();
  } catch (err) {
    console.warn('[RELAY] Init failed:', err.message);
  }
}

function connectRelay() {
  if (!relaySessionId) return;
  
  try {
    const wsUrl = RELAY_URL.replace('https://', 'wss://').replace('http://', 'ws://');
    relayWs = new WebSocket(wsUrl + '/ws?session=' + relaySessionId + '&role=player');
    
    relayWs.onopen = () => {
      console.log('[RELAY] Connected as player');
    };
    
    relayWs.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'ws_connected' || msg.type === 'ws_peer') return; // relay meta
        handleCommand(msg);
      } catch (err) {}
    };
    
    relayWs.onclose = () => {
      console.log('[RELAY] Disconnected, reconnecting...');
      setTimeout(connectRelay, 3000);
    };
    
    relayWs.onerror = () => { relayWs.close(); };
  } catch (err) {
    setTimeout(connectRelay, 5000);
  }
}

// Start relay session on page load
initRelay();

// Broadcast state to controller (every 3 frames ≈ 20Hz)
let broadcastCounter = 0;
let beatJustFired = false;
let beatFiredFrames = 0;

function broadcastState() {
  if (!controllerConnected && !(relayWs && relayWs.readyState === 1)) return;
  broadcastCounter++;
  
  const urgent = beatFiredFrames > 0;
  if (beatFiredFrames > 0) beatFiredFrames--;
  
  // BroadcastChannel: 20Hz (every 3 frames) — local, free
  const bcTick = urgent || broadcastCounter % 3 === 0;
  // WebSocket relay: 5Hz (every 12 frames) — remote, metered
  const wsTick = urgent || broadcastCounter % 12 === 0;
  
  if (!bcTick && !wsTick) return;
  
  try {
    const state = {
      type: 'state',
      bpm: bpm || 0,
      beatIndex: beatIndex || 0,
      bar16: (phraseCounter || 0) % 16,  // 0-15 position within 16-beat phrase
      phraseCounter: phraseCounter || 0,
      beatJustFired: beatFiredFrames > 0,
      activePreset: activePreset || 0,
      energy: normEnergy || 0,
      mood: mood || 'LISTENING',
      beatCutEnabled: !!beatCutEnabled,
      beatCutInterval: beatCutInterval || 4,
      beatCutActive: beatCutActive ? [...beatCutActive] : [],
      colorIndex: colorIndex || 0,
      colorPool: [...colorPool],
      stroboActive: !!stroboActive,
      videoHidden: !!videoHidden,
      videoSpeed: videoSpeed || 1,
      videoSpeedMultiplier: videoSpeedMultiplier || 1,
      fxIntensity: fxIntensity || 1,
      fxSliderValue: fxSliderValue || 1,
      smoothBass: smoothBass || 0,
      smoothMid: smoothMid || 0,
      smoothHigh: smoothHigh || 0,
      presetReady: presetReady ? [...presetReady] : [],
      presetPool: [...presetPool],
      presetEnergies: PRESETS.map(p => p.energy || 2),
      presetTypes: PRESETS.map(p => p.type || 'video'),
      pinchScale: pinchScale || 1,
      autopilotEnabled: !!autopilotEnabled,
      autoEnergyEnabled: !!autoEnergyEnabled,
      autoFxEnabled: !!autoFxEnabled,
      autoBeatCutEnabled: !!autoBeatCutEnabled,
      autoStroboEnabled: !!autoStroboEnabled,
      autoColorEnabled: !!autoColorEnabled,
      autoSpeedEnabled: !!autoSpeedEnabled,
      videoJumpEnabled: !!videoJumpEnabled,
      cdjConnected: !!cdjConnected,
      cdjBarBeat,
      drive: masterDrive,
      cdjTrackTitle: cdjTrackTitle || '',
      audioSource: audioSourceName || '',
      audioDevices: availableAudioDevices || [],
      availableCameras: availableCameras || [],
      activeThemes,
      themeWeights,
    };
    
    // Send to local controller (BroadcastChannel) — 20Hz
    if (bcTick) omenChannel.postMessage(state);
    
    // Send to remote controller (WebSocket relay) — 5Hz
    if (wsTick && relayWs && relayWs.readyState === 1) {
      relayWs.send(JSON.stringify(state));
    }
  } catch (err) {
    console.error('broadcast error:', err);
  }
}
