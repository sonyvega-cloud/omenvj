<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<title>ØMEN Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    background: #000;
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    width: 100%;
  }
  html {
    clip-path: inset(0); /* clips position:fixed elements at viewport edges */
  }
  body {
    color: #fff;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  /* ── Video layer ─────────────────────────────────────── */
  #videoLayer {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    overflow: hidden;
    background: #000;
  }
  #videoLayer video {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    min-width: 100vw;
    min-height: 100vh;
    width: max(100vw, 100vh);
    height: max(100vw, 100vh);
    object-fit: cover;
    opacity: 0;
    z-index: 0;
    backface-visibility: hidden;
    pointer-events: none;
  }
  #videoLayer video.active {
    opacity: 1;
    z-index: 1;
    will-change: transform;
  }

  /* ── Vignette over video ─────────────────────────────── */
  #videoVignette {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: max(100vw, 100vh);
    height: max(100vw, 100vh);
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle closest-side,
      transparent 0%,
      transparent 40%,
      rgba(0,0,0,0.08) 52%,
      rgba(0,0,0,0.25) 62%,
      rgba(0,0,0,0.50) 72%,
      rgba(0,0,0,0.75) 82%,
      rgba(0,0,0,0.92) 92%,
      rgba(0,0,0,1.0) 100%
    );
  }

  /* ── Edge mask — guarantees solid black edges on any aspect ratio ── */
  #edgeMask {
    position: fixed;
    top: -50px; left: -50px;
    width: calc(100vw + 100px); height: calc(100vh + 100px);
    z-index: 3;
    pointer-events: none;
    box-shadow: inset 0 0 80px 40px #000;
  }

  /* ── Fullscreen canvas (GFX over vignette) ─────────── */
  #canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 2;
    pointer-events: none;
  }

  /* ── Setup overlay ─────────────────────────────────── */
  #setup {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 100;
    background: rgba(0,0,0,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s;
  }
  #setup.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .setup-box {
    text-align: center;
    max-width: 400px;
    padding: 40px;
  }
  .setup-box h1 {
    font-size: 2.5rem;
    letter-spacing: 1rem;
    font-weight: 100;
    margin-bottom: 0.3rem;
    color: #fff;
  }
  .setup-box .sub {
    font-size: 0.65rem;
    letter-spacing: 0.4rem;
    color: rgba(255,255,255,0.2);
    margin-bottom: 3rem;
    text-transform: uppercase;
  }
  .source-btn {
    display: block;
    width: 100%;
    padding: 14px 20px;
    margin-bottom: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    color: rgba(255,255,255,0.6);
    font-size: 0.8rem;
    letter-spacing: 0.15rem;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }
  .source-btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.15);
    color: #fff;
  }
  .source-btn .label {
    font-size: 0.85rem;
    letter-spacing: 0.1rem;
  }
  .source-btn .desc {
    font-size: 0.6rem;
    color: rgba(255,255,255,0.25);
    margin-top: 4px;
    letter-spacing: 0.05rem;
  }

  /* ── HUD overlay ───────────────────────────────────── */
  #hud {
    position: fixed;
    top: 20px; left: 20px;
    z-index: 100;
    font-size: 0.65rem;
    letter-spacing: 0.15rem;
    color: rgba(255,255,255,0.3);
    transition: opacity 0.3s;
  }
  #hud.hidden { opacity: 0; pointer-events: none; }
  #hud .bpm {
    font-size: 1.8rem;
    font-weight: 100;
    letter-spacing: 0.3rem;
    color: rgba(255,255,255,0.5);
    line-height: 1;
  }
  .bdot {
    width: 7px;
    height: 7px;
    border-radius: 1px;
    background: rgba(255,255,255,0.08);
    transition: background 0.05s;
  }
  .bdot.on {
    background: rgba(255,255,255,0.7);
  }
  .bdot.downbeat {
    background: #ff2200;
  }
  .pgrid {
    width: 18px;
    height: 18px;
    border-radius: 3px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.2);
    font-size: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    cursor: pointer;
    user-select: none;
  }
  .pgrid:hover {
    border-color: rgba(255,255,255,0.25);
  }
  .pgrid.active {
    background: rgba(255,34,0,0.25);
    border-color: rgba(255,34,0,0.5);
    color: #ff2200;
  }
  .pgrid.loaded {
    border-color: rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.4);
  }
  .pgrid.bc-active {
    background: rgba(255,34,0,0.15);
    border-color: rgba(255,34,0,0.4);
    color: rgba(255,34,0,0.8);
  }
  .pgrid.bc-dim {
    background: rgba(255,34,0,0.05);
    border-color: rgba(255,34,0,0.15);
    color: rgba(255,34,0,0.3);
  }
  .pgrid.cut-on {
    background: rgba(255,34,0,0.2);
    border-color: rgba(255,34,0,0.4);
    color: #ff2200;
  }
  .pgrid.excluded {
    opacity: 0.2;
  }
  .cdot {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .cdot.active {
    border-color: rgba(255,255,255,0.5);
    box-shadow: 0 0 4px rgba(255,255,255,0.2);
  }
  .cdot.excluded {
    opacity: 0.2;
  }
  #hud .energy-bar {
    width: 120px;
    height: 2px;
    background: rgba(255,255,255,0.06);
    margin-top: 8px;
    border-radius: 1px;
    overflow: hidden;
  }
  #hud .energy-fill {
    height: 100%;
    background: #ff2200;
    transition: width 0.15s;
    border-radius: 1px;
  }
  #hud .mood {
    margin-top: 4px;
    font-size: 0.55rem;
    letter-spacing: 0.2rem;
    text-transform: uppercase;
  }
  #hud .source-label {
    margin-top: 12px;
    font-size: 0.5rem;
    letter-spacing: 0.1rem;
    color: rgba(255,255,255,0.15);
  }

  /* ── Controls hint ─────────────────────────────────── */
  #controls-hint {
    position: fixed;
    bottom: 20px;
    left: 0; right: 0;
    text-align: center;
    z-index: 50;
    font-size: 0.5rem;
    letter-spacing: 0.15rem;
    color: rgba(255,255,255,0.12);
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #controls-hint.hidden { opacity: 0; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<!-- ── Video layer (generated dynamically) ────────────── -->
<div id="videoLayer"></div>
<canvas id="cameraLayer" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:100vh; height:100vh; z-index:0; display:none;"></canvas>
<div id="camColorOverlay" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:100vh; height:100vh; z-index:0; pointer-events:none; mix-blend-mode:multiply; display:none;"></div>
<div id="videoVignette"></div>
<div id="edgeMask"></div>

<!-- ── Setup: Single start button ──────────────────── -->
<div id="setup">
  <div class="setup-box">
    <img src="https://cdn.omenvj.com/logo.png" alt="ØMEN" style="width: min(280px, 50vw); margin-bottom: 1rem; opacity: 0.9;">
    
    <button class="source-btn" onclick="startAudio('mic')" style="margin-top:1.5rem;">
      <div class="label">▶ START ENGINE</div>
      <div class="desc">Default audio input (change from controller)</div>
    </button>
    
    <div style="font-size:0.45rem; color:rgba(255,255,255,0.12); letter-spacing:0.1em; margin-top:1.5rem;">
      Press S for System Audio capture
    </div>
  </div>
</div>

<!-- ── HUD (HIDDEN — all control via controller.html) ────── -->
<div id="hud" style="display:none;">
  <div class="bpm" id="bpmDisplay">— BPM</div>
  <div id="beatDots"></div>
  <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
  <div id="presetBtns"></div>
  <div id="bcToggle"></div>
  <div id="bci1"></div><div id="bci2"></div><div id="bci4"></div><div id="bci8"></div>
  <div id="cd0"></div><div id="cd1"></div><div id="cd2"></div><div id="cd3"></div><div id="cd4"></div>
  <div id="strbBtn"></div><div id="vhidBtn"></div>
  <input type="range" id="fxSlider" min="0" max="200" value="100">
  <div id="spd05"></div><div id="spd10"></div><div id="spd20"></div>
  <div class="mood" id="moodDisplay"></div>
  <div id="sourceLabel"></div>
  <div id="debugDisplay"></div>
</div>

<div id="controls-hint" style="display:none;"></div>

<!-- PIN — visible in corner for pairing -->
<div id="pinDisplay" style="display:none; position:fixed; top:12px; right:16px; z-index:999; font-family:monospace; font-size:11px; color:rgba(255,255,255,0.4); pointer-events:none;">
  PIN: <span id="pinCode" style="color:#ff2200; font-size:14px; letter-spacing:0.2em;">----</span>
</div>

<script src="presets.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════
// ØMEN Web Engine — Sprint 1
// ═══════════════════════════════════════════════════════════════

// ── Audio state ────────────────────────────────────────────────
let audioCtx = null;
let analyser = null;
let freqData = null;
let timeData = null;
const FFT_SIZE = 2048;

// ── Audio bands ────────────────────────────────────────────────
let bass = 0, mid = 0, high = 0, volume = 0;
let smoothBass = 0, smoothMid = 0, smoothHigh = 0, smoothVol = 0;

// AGC (auto gain control) — normalizes input to consistent level
let _agcGainNode = null;
const AGC_TARGET = 0.18;     // target smoothVol average during music
const AGC_MIN_GAIN = 0.5;
const AGC_MAX_GAIN = 20.0;
let _agcVolAccum = 0;
let _agcFrameCount = 0;

// ── Beat detection ─────────────────────────────────────────────
let bpm = 0;
let beatIndex = 0;
let lastBeatTime = 0;
let beatThreshold = 0.12;
let beatCooldown = 180; // ms min between beats
let bassHistory = [];
const BASS_HISTORY_LEN = 60; // ~1 second

// ── BPM tap ────────────────────────────────────────────────────
let tapTimes = [];
const TAP_TIMEOUT = 2500;

// ── Energy & Mood ──────────────────────────────────────────────
let energy = 0;
let normEnergy = 0;
let mood = 'LISTENING';
let moodCandidate = 'LISTENING';
let moodHoldFrames = 0;
let prevBass = 0;
let bassPulse = 0;
let bassPulseAvg = 0;
let volAvg = 0;
let bassRunningAvg = 0;
let driveHistory = [];
const DRIVE_HISTORY_LEN = 3600;  // ~60 seconds at 60fps — full track dynamic range
let _threshAmbient = 0.65;
let _threshBuilding = 1.02;
let _threshPeak = 1.40;
let moodBeatCounter = 0;
const MOOD_MAX_BEATS = 32;
let driveRecalcCounter = 0;
let watchdogLockedMood = '';  // mood that watchdog forced away from
let watchdogLockFrames = 0;   // frames remaining where locked mood is blocked
let energyHistory = [];
const ENERGY_HISTORY_LEN = 360; // 6 seconds at 60fps — enough for breakdown detection

// ── Visual state ───────────────────────────────────────────────
let beatFlash = 0;
let pulseScale = 1.0;
// Video jump scale (discrete kick/downbeat jumps — TYPO-like)
let videoJumpScale = 1.0;       // 1.0 = neutral, decays toward 1.0
let videoJumpEnabled = true;    // global toggle from controller
let _lastKickJump = 0;          // timestamp of last kick-triggered jump
let _prevKickTime = 0;          // for double-kick detection
let compassAngle = 0;
let compassTarget = 0;

// ── FX state (iOS port) ───────────────────────────────────────
let fxIntensity = 1.0;     // global FX multiplier
let masterDrive = 70;      // 0-100 master drive
let driveScale = 0.70;     // 0.0-1.0 derived from drive

// Map drive 0-100 to all parameters
function applyDrive(d) {
  const oldScale = driveScale;
  masterDrive = d;
  const n = d / 100;
  driveScale = n;
  videoSpeedMultiplier = 0.7 + n * 1.3;
  
  // Instant jump fxIntensity when drive increases significantly
  if (n > oldScale + 0.1) {
    fxIntensity = n;
  }
  // Drive controls VISUAL INTENSITY only, NOT preset pool
}

let fxSliderValue = 1.0;   // user-set FX intensity (slider)
let exposureOpacity = 0;   // white center glow on beat
let silenceTimer = 0;      // frames since last significant audio
let stroboActive = false;
let manualStrobo = false;
let stroboFlash = 0;           // final strobo opacity 0-1
let stroboEnvelope = 0.85;     // brightness envelope (auto fade)
let stroboBeatToggle = false;  // flicker toggle per beat
let stroboMaxFrames = 0;
let videoSpeedMultiplier = 1.0; // ½×, 1×, 2×
const SILENCE_THRESHOLD = 0.05;
const SILENCE_DAMPEN_AFTER = 90;

// ── Preset Registry (localStorage from editor → presets.js fallback) ──
let PRESETS = [];
function loadPresets() {
  const scenes = localStorage.getItem('omen_scenes');
  if (scenes) {
    try {
      const parsed = JSON.parse(scenes);
      if (parsed.length > 0) {
        const cdn = typeof CDN !== 'undefined' ? CDN : '';
        PRESETS = parsed.map(p => ({
          ...p,
          videoA: p.type === 'video' && p.videoA && !p.videoA.startsWith('http') ? cdn + p.videoA : (p.type === 'video' ? p.videoA : null),
        }));
        console.log('[PRESETS] Loaded ' + PRESETS.length + ' from scenes');
        return;
      }
    } catch(e) {}
  }
  const saved = localStorage.getItem('omen_presets');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed.length > 0) {
        const cdn = typeof CDN !== 'undefined' ? CDN : '';
        PRESETS = parsed.map(p => ({
          ...p,
          videoA: p.videoA && !p.videoA.startsWith('http') ? cdn + p.videoA : p.videoA,
        }));
        console.log('[PRESETS] Loaded ' + PRESETS.length + ' from presets');
        return;
      }
    } catch(e) {}
  }
  PRESETS = typeof PRESETS_DATA !== 'undefined' ? PRESETS_DATA : [];
  console.log('[PRESETS] Loaded ' + PRESETS.length + ' from presets.js');
}
loadPresets();

// Auto-assign energy category if not set in editor
// First third = CAT 1 (ambient), middle = CAT 2, last third = CAT 3 (groove)
PRESETS.forEach((p, i) => {
  if (!p.energy) {
    const pos = PRESETS.length > 1 ? i / (PRESETS.length - 1) : 0.5;
    if (pos < 0.33) p.energy = 1;
    else if (pos < 0.66) p.energy = 2;
    else p.energy = 3;
  }
});
console.log('[ENERGY]', PRESETS.map((p,i) => p.name + ':CAT' + p.energy).join(', '));

let videoLoaded = false;
let presetReady = new Array(PRESETS.length).fill(false);
let presetPool = new Set(PRESETS.map((_, i) => i)); // which presets autopilot can use
let userExcludedPresets = new Set(); // presets user manually X'd out (priority over drive)
let activePreset = 0;
// Beat cut (iOS-style with active set)
let beatCutEnabled = false;
let beatCutInterval = 4;
let beatCutCountdown = 4;  // countdown to next cut (beats remaining)
let beatCutSequenceIdx = 0;
let beatCutActive = new Set(PRESETS.map((_, i) => i));

// ── Phrase detection (breakdown → drop alignment) ──────────────
// Two parts:
//   updatePhraseAudio() — every frame — detects breakdown/return from audio
//   updatePhraseOnBeat() — on beat events — increments counter + fires reset
let phraseState = 'NORMAL';       // NORMAL | BREAKDOWN | DROP_EXPECTED
let phraseCounter = 0;            // beats since last phrase reset
let phraseResetCooldown = 0;      // prevents double-fire (beats)
let breakdownFrames = 0;          // frames of sustained low energy
const BREAKDOWN_THRESHOLD = 0.02; // smoothVol below this = "silence"
const BREAKDOWN_RETURN = 0.04;    // smoothVol above this = "returning"
const BREAKDOWN_MIN_FRAMES = 120; // ~2 seconds at 60fps (≈ 8 beats at 128bpm)
const PHRASE_RESET_COOLDOWN = 16; // beats

// Called every frame from tick() — works even when CDJ sends no beats
function updatePhraseAudio() {
  // Phrase detection only with autopilot (user-specified)
  if (!autopilotEnabled) { phraseState = 'NORMAL'; return; }
  
  switch (phraseState) {
    case 'NORMAL':
      if (smoothVol < BREAKDOWN_THRESHOLD) {
        breakdownFrames++;
        if (breakdownFrames >= BREAKDOWN_MIN_FRAMES) {
          phraseState = 'BREAKDOWN';
          console.log('[PHRASE] Breakdown detected (silence for', (breakdownFrames / 60).toFixed(1) + 's)');
        }
      } else {
        breakdownFrames = 0;
      }
      break;
      
    case 'BREAKDOWN':
      if (smoothVol >= BREAKDOWN_RETURN) {
        phraseState = 'DROP_EXPECTED';
        breakdownFrames = 0;
        console.log('[PHRASE] Energy returning, waiting for kick...');
      }
      break;
      
    case 'DROP_EXPECTED':
      breakdownFrames++;
      // Kick detected = PHRASE RESET
      const kickDetected = bassPulse > bassPulseAvg * 1.5 || smoothBass > 0.15;
      if (kickDetected && phraseResetCooldown === 0) {
        phraseReset('kick');
      }
      // Safety: 3 seconds without kick → soft reset
      if (phraseState === 'DROP_EXPECTED' && breakdownFrames > 180) {
        phraseReset('timeout');
      }
      break;
  }
}

function phraseReset(reason) {
  const oldCounter = phraseCounter;
  phraseCounter = 0;
  breakdownFrames = 0;
  phraseResetCooldown = PHRASE_RESET_COOLDOWN;
  phraseState = 'NORMAL';
  
  if (beatCutEnabled) {
    beatCutCountdown = beatCutInterval;
    console.log('[PHRASE] ★ RESET (' + reason + ')! Cut realigned. Was at beat', oldCounter);
  } else {
    console.log('[PHRASE] Reset (' + reason + ') at beat', oldCounter);
  }
}

// Called on beat events — just increments counter + cooldown
function updatePhraseOnBeat() {
  phraseCounter++;
  if (phraseResetCooldown > 0) phraseResetCooldown--;
}

// Video specs — FIXED: 600 frames, 25fps, 48-beat sync
const VIDEO_FRAMES = 600;
const VIDEO_FPS = 25;
const VIDEO_DURATION_S = VIDEO_FRAMES / VIDEO_FPS;
const VIDEO_SYNC_BEATS = 48;

// Scale — web: CSS object-fit:cover fills viewport, we just need margin for rotation
const SQRT2 = 1.41421356;
const VIDEO_BASE_SCALE = 1.0; // web: 1.0 = viewport fill (iOS was 0.375 due to different chain)

// Speed
let videoSpeed = 1.0;
let videoCompassAngle = 0;
let _lastVideoTransform = 'translate(-50%,-50%)';

// ── Color palettes (from iOS) ──────────────────────────────────
const palettes = [
  ['#1A0000','#8B0000','#FF2200','#FF6644'], // red
  ['#0A0A1A','#1A1A8B','#2244FF','#44AAFF'], // blue
  ['#001A00','#008B00','#22FF44','#88FF66'], // green
  ['#1A1A00','#8B8B00','#FFCC00','#FFEE44'], // yellow
  ['#1A1A1A','#666666','#CCCCCC','#FFFFFF'], // white/mono
];
let colorIndex = 0;
let colorPool = new Set([0, 1, 2, 3, 4]); // which colors autopilot can use

// ── Canvas ─────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, CX, CY;

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  CX = W / 2;
  CY = H / 2;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  W /= devicePixelRatio;
  H /= devicePixelRatio;
  CX = W / 2;
  CY = H / 2;
}
window.addEventListener('resize', resize);
resize();

// ═══════════════════════════════════════════════════════════════
// Audio Init
// ═══════════════════════════════════════════════════════════════

function showDevicePicker(devices) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;';
    
    const panel = document.createElement('div');
    panel.style.cssText = 'background:#141414;border:1px solid #333;padding:20px;max-width:400px;width:90%;font-family:monospace;';
    
    const title = document.createElement('div');
    title.textContent = 'SELECT AUDIO INPUT';
    title.style.cssText = 'font-size:11px;letter-spacing:0.2em;color:#ff2200;margin-bottom:16px;';
    panel.appendChild(title);
    
    devices.forEach(d => {
      const btn = document.createElement('button');
      btn.textContent = d.label || 'Audio Device ' + d.deviceId.slice(0, 8);
      btn.style.cssText = 'display:block;width:100%;padding:10px;margin-bottom:6px;background:#0a0a0a;border:1px solid #2a2a2a;color:#e0e0e0;font-family:monospace;font-size:11px;cursor:pointer;text-align:left;';
      btn.onmouseover = () => { btn.style.borderColor = '#ff2200'; };
      btn.onmouseout = () => { btn.style.borderColor = '#2a2a2a'; };
      btn.onclick = () => { overlay.remove(); resolve(d.deviceId); };
      panel.appendChild(btn);
    });
    
    const cancel = document.createElement('button');
    cancel.textContent = 'CANCEL';
    cancel.style.cssText = 'display:block;width:100%;padding:8px;margin-top:8px;background:none;border:1px solid #2a2a2a;color:#666;font-family:monospace;font-size:10px;cursor:pointer;letter-spacing:0.15em;';
    cancel.onclick = () => { overlay.remove(); resolve(null); };
    panel.appendChild(cancel);
    
    overlay.appendChild(panel);
    document.body.appendChild(overlay);
  });
}

async function startAudio(source) {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = FFT_SIZE;
    analyser.smoothingTimeConstant = 0.5;  // less smoothing = sharper transients
    analyser.minDecibels = -90;
    analyser.maxDecibels = -10;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.fftSize);

    let stream;
    let sourceLabel = '';

    if (source === 'system') {
      // System audio via getDisplayMedia
      stream = await navigator.mediaDevices.getDisplayMedia({
        audio: true,
        video: true // required but we discard it
      });
      // Remove video track — we only want audio
      stream.getVideoTracks().forEach(t => t.stop());
      sourceLabel = 'SYSTEM AUDIO';
    }
    else if (source === 'linein') {
      // Get permission first
      const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      tempStream.getTracks().forEach(t => t.stop());
      
      const devices = await navigator.mediaDevices.enumerateDevices();
      const audioInputs = devices.filter(d => d.kind === 'audioinput');
      
      // Broadcast available devices for controller picker
      availableAudioDevices = audioInputs.map(d => ({ deviceId: d.deviceId, label: d.label || 'Audio ' + d.deviceId.slice(0, 8) }));
      
      if (deviceId) {
        // Specific device from controller
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { deviceId: { exact: deviceId } }
        });
        const picked = audioInputs.find(d => d.deviceId === deviceId);
        sourceLabel = 'LINE-IN: ' + (picked?.label || 'Audio Device');
      } else {
        // Auto-pick first device (no popup on player)
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        sourceLabel = 'LINE-IN: ' + (audioInputs[0]?.label || 'Default');
      }
    }
    else {
      // Mic fallback
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      sourceLabel = 'MICROPHONE';
    }

    const audioSource = audioCtx.createMediaStreamSource(stream);
    // AGC: auto gain control — normalizes any input level
    const gainNode = audioCtx.createGain();
    gainNode.gain.value = 2.5; // initial guess, AGC adjusts
    audioSource.connect(gainNode);
    gainNode.connect(analyser);
    // Don't connect to destination — no feedback loop
    
    // Store gainNode for AGC
    _agcGainNode = gainNode;

    // UI
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('controls-hint').classList.remove('hidden');
    document.getElementById('sourceLabel').textContent = sourceLabel;
    audioSourceName = sourceLabel;

    // Reinit preset arrays (presets.json already loaded at page load)
    presetReady = new Array(PRESETS.length).fill(false);
    presetPool = new Set(PRESETS.map((_, i) => i));
    beatCutActive = new Set(PRESETS.map((_, i) => i));

    // Start render loop
    initPresets();
    requestAnimationFrame(tick);
    
  } catch (err) {
    console.error('Audio init failed:', err);
    alert('Audio access denied or not available.\n\n' + err.message);
  }
}

// ═══════════════════════════════════════════════════════════════
// FFT Analysis
// ═══════════════════════════════════════════════════════════════

function analyseAudio() {
  analyser.getByteFrequencyData(freqData);
  analyser.getByteTimeDomainData(timeData);
  
  const binCount = analyser.frequencyBinCount;
  const nyquist = audioCtx.sampleRate / 2;
  
  // Frequency band boundaries
  const bassEnd = Math.floor(150 / nyquist * binCount);   // 0-150 Hz
  const midEnd = Math.floor(2000 / nyquist * binCount);    // 150-2000 Hz
  const highEnd = Math.floor(8000 / nyquist * binCount);   // 2000-8000 Hz
  
  // Raw band averages (0-1)
  let bassSum = 0, midSum = 0, highSum = 0, volSum = 0;
  
  for (let i = 0; i < bassEnd; i++) bassSum += freqData[i];
  for (let i = bassEnd; i < midEnd; i++) midSum += freqData[i];
  for (let i = midEnd; i < highEnd; i++) highSum += freqData[i];
  for (let i = 0; i < binCount; i++) volSum += freqData[i];
  
  bass = (bassSum / bassEnd / 255) || 0;
  mid = (midSum / (midEnd - bassEnd) / 255) || 0;
  high = (highSum / (highEnd - midEnd) / 255) || 0;
  volume = (volSum / binCount / 255) || 0;
  
  // Smoothing (EMA) — bass less smoothed for punch
  smoothBass = smoothBass * 0.70 + bass * 0.30;
  smoothMid = smoothMid * 0.82 + mid * 0.18;
  smoothHigh = smoothHigh * 0.75 + high * 0.25;
  smoothVol = smoothVol * 0.80 + volume * 0.20;
  
  // AGC: adjust gain every ~1 second to keep smoothVol near target
  if (_agcGainNode) {
    _agcVolAccum += smoothVol;
    _agcFrameCount++;
    if (_agcFrameCount >= 60) {
      const avg = _agcVolAccum / _agcFrameCount;
      _agcVolAccum = 0;
      _agcFrameCount = 0;
      
      if (avg > 0.001) { // only adjust when there's actual signal
        const ratio = AGC_TARGET / avg;
        // Smooth adjustment — don't jump wildly
        const currentGain = _agcGainNode.gain.value;
        const newGain = Math.min(AGC_MAX_GAIN, Math.max(AGC_MIN_GAIN, currentGain * (0.85 + 0.15 * ratio)));
        _agcGainNode.gain.value = newGain;
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// Beat Detection (from bass transients)
// ═══════════════════════════════════════════════════════════════

function detectBeat() {
  bassHistory.push(bass);
  if (bassHistory.length > BASS_HISTORY_LEN) bassHistory.shift();
  
  if (bassHistory.length < 10) return false;
  
  const avg = bassHistory.reduce((a, b) => a + b) / bassHistory.length;
  const now = performance.now();
  
  if (bass > avg * 1.2 + beatThreshold && 
      now - lastBeatTime > beatCooldown) {
    lastBeatTime = now;
    // beatIndex NOT incremented here — caller handles it
    return true;
  }
  return false;
}

// ═══════════════════════════════════════════════════════════════
// Energy & Mood Detection
// ═══════════════════════════════════════════════════════════════

function updateEnergy() {
  const bpmFactor = bpm > 0 ? Math.min(bpm / 150, 1.0) : 0.5;
  const rawEnergy = (smoothBass * 0.4 + smoothVol * 0.3 + bpmFactor * 0.3);
  energy = energy * 0.95 + rawEnergy * 0.05;
  
  energyHistory.push(energy);
  if (energyHistory.length > ENERGY_HISTORY_LEN) energyHistory.shift();
  
  // ── Bass PULSE detection (kick vs pad) ──────────────────────
  const bassDelta = Math.abs(smoothBass - prevBass);
  prevBass = smoothBass;
  
  // Fast pulse tracker (~1s)
  bassPulse = bassPulse * 0.95 + bassDelta * 0.05;
  
  // Very slow baseline — remembers "normal kick energy" for 30+ seconds
  // Only updates UPWARD fast, downward very slow (ratchet effect)
  if (bassPulse > bassPulseAvg) {
    bassPulseAvg = bassPulseAvg * 0.99 + bassPulse * 0.01; // rises in ~2s
  } else {
    bassPulseAvg = bassPulseAvg * 0.9998 + bassPulse * 0.0002; // falls in ~30s
  }
  
  // Also track volume baseline (same ratchet)
  if (smoothVol > volAvg) {
    volAvg = volAvg * 0.99 + smoothVol * 0.01;
  } else {
    volAvg = volAvg * 0.9998 + smoothVol * 0.0002;
  }
  
  const pulseRatio = bassPulseAvg > 0.0003 ? bassPulse / bassPulseAvg : 1.0;
  const volRatio = volAvg > 0.005 ? smoothVol / volAvg : 1.0;
  
  // ── VIDEO JUMP: extra kick trigger + half-beat double-kick detection ──
  const curPresetHasVJ = PRESETS[activePreset]?.videoJump && videoJumpEnabled;
  if (curPresetHasVJ) {
    // Strong kick (> 2.5 pulseRatio + audible bass) → extra jump
    const kickDetect = pulseRatio > 2.5 && smoothBass > 0.08;
    const now = performance.now();
    if (kickDetect && (now - _lastKickJump) > 80) { // debounce 80ms
      _lastKickJump = now;
      let jumpScale = 1.25;
      if (mood === 'DROP' || mood === 'PEAK') jumpScale = 1.45;
      // Only bump if stronger than current
      if (jumpScale > videoJumpScale) videoJumpScale = jumpScale;
      
      // Double-kick detection: kick within 250-350ms of last = off-beat half
      // Works as 3A (DROP mood) or 3C (any double-kick)
      if (_prevKickTime > 0) {
        const delta = now - _prevKickTime;
        // Half-beat at BPM range 110-140 = ~215-275ms between kicks
        if (delta > 200 && delta < 350 && (mood === 'DROP' || mood === 'PEAK')) {
          videoJumpScale = Math.max(videoJumpScale, 1.35);
        }
      }
      _prevKickTime = now;
    }
  }
  
  if (energyHistory.length < 60) { mood = 'LISTENING'; return; }
  
  // ── Adaptive normalization ──────────────────────────────────
  let histMin = Infinity, histMax = -Infinity;
  for (let i = 0; i < energyHistory.length; i++) {
    if (energyHistory[i] < histMin) histMin = energyHistory[i];
    if (energyHistory[i] > histMax) histMax = energyHistory[i];
  }
  const range = histMax - histMin;
  normEnergy = range > 0.02 ? (energy - histMin) / range : 0.5;
  
  // ── Bass average (slow ratchet for ratio) ────────────────────
  if (smoothBass > bassRunningAvg) {
    bassRunningAvg = bassRunningAvg * 0.99 + smoothBass * 0.01;
  } else {
    bassRunningAvg = bassRunningAvg * 0.9998 + smoothBass * 0.0002;
  }
  const bassRatio = bassRunningAvg > 0.003 ? smoothBass / bassRunningAvg : 1.0;
  
  // ── DRIVE SCORE: single number combining all signals ─────────
  const driveScore = (pulseRatio * 0.4) + (volRatio * 0.3) + (bassRatio * 0.3);
  
  // ── Drive score history for floating thresholds ─────────────
  driveHistory.push(driveScore);
  if (driveHistory.length > DRIVE_HISTORY_LEN) driveHistory.shift();
  
  // ── Floating thresholds from percentiles (recalc every 60 frames = 1s) ──
  driveRecalcCounter++;
  if (driveHistory.length >= 180 && driveRecalcCounter >= 60) {
    driveRecalcCounter = 0;
    const sorted = [...driveHistory].sort((a, b) => a - b);
    const len = sorted.length;
    _threshAmbient = sorted[Math.floor(len * 0.20)];   // P20
    _threshBuilding = sorted[Math.floor(len * 0.50)];  // P50 (median)
    _threshPeak = sorted[Math.floor(len * 0.85)];      // P85
    
    // Safety: minimum separation
    if (_threshBuilding < _threshAmbient + 0.05) _threshBuilding = _threshAmbient + 0.05;
    if (_threshPeak < _threshBuilding + 0.05) _threshPeak = _threshBuilding + 0.05;
  }
  const threshAmbient = _threshAmbient;
  const threshBuilding = _threshBuilding;
  const threshPeak = _threshPeak;
  
  // ── Candidate mood from floating thresholds ─────────────────
  let candidateMood = 'GROOVE';
  
  // Silence → AMBIENT (hard override)
  if (smoothVol < 0.03) {
    candidateMood = 'AMBIENT';
  }
  // KICK-FORWARD DETECT: strong pulse = upgrade mood beyond floating score
  // This ensures ambient-style techno with occasional kicks doesn't stay AMBIENT
  else if (pulseRatio > 2.5 && smoothBass > 0.08) {
    // Very strong kick (punchy) + audible bass = upgrade based on current state
    if (mood === 'AMBIENT' || mood === 'LISTENING') candidateMood = 'BUILDING';
    else candidateMood = 'GROOVE';
  }
  else if (driveScore < threshAmbient) {
    candidateMood = 'AMBIENT';
  }
  else if (driveScore < threshBuilding) {
    candidateMood = 'BUILDING';
  }
  else if (pulseRatio > 1.8 && (mood === 'BUILDING' || mood === 'AMBIENT')) {
    candidateMood = 'DROP';
  }
  else if (driveScore > threshPeak && normEnergy > 0.7) {
    candidateMood = 'PEAK';
  }
  
  // Watchdog lock: can't revert to locked mood for 3 seconds
  if (watchdogLockFrames > 0 && candidateMood === watchdogLockedMood) {
    candidateMood = 'GROOVE'; // safe default
  }
  
  // ── Hysteresis ──────────────────────────────────────────────
  if (candidateMood !== moodCandidate) {
    moodCandidate = candidateMood;
    moodHoldFrames = 0;
  } else {
    moodHoldFrames++;
  }
  
  const holdRequired = candidateMood === 'AMBIENT' ? 120
                     : candidateMood === 'DROP' ? 3
                     : candidateMood === 'PEAK' ? 60
                     : candidateMood === 'BUILDING' ? 120
                     : 30;
  
  if (moodHoldFrames >= holdRequired) {
    if (mood !== candidateMood) {
      const oldCat = (mood === 'AMBIENT' || mood === 'LISTENING') ? 1 : mood === 'BUILDING' ? 2 : 3;
      mood = candidateMood;
      moodBeatCounter = 0;
      const newCat = (mood === 'AMBIENT' || mood === 'LISTENING') ? 1 : mood === 'BUILDING' ? 2 : 3;
      if (oldCat !== newCat && autopilotEnabled) updatePresetGrid();
    }
  }
  
  // ── Watchdog: force mood rotation after MOOD_MAX_BEATS ──────
  // Prevents getting stuck in any one mood forever
  // Skip during silence — AMBIENT is correct when no audio
  if (moodBeatCounter >= MOOD_MAX_BEATS && autopilotEnabled && smoothVol >= 0.008) {
    const prevMood = mood;
    // Force next mood in cycle
    if (mood === 'AMBIENT') mood = 'BUILDING';
    else if (mood === 'BUILDING') mood = 'GROOVE';
    else if (mood === 'GROOVE') mood = 'PEAK';
    else if (mood === 'PEAK') mood = 'GROOVE';
    else if (mood === 'DROP') mood = 'GROOVE';
    moodBeatCounter = 0;
    moodCandidate = mood;
    moodHoldFrames = 999; // skip hysteresis for forced mood
    watchdogLockedMood = prevMood; // can't go back to this
    watchdogLockFrames = 180; // 3 seconds lock
  }
  
  // Decay watchdog lock
  if (watchdogLockFrames > 0) watchdogLockFrames--;
  
  // Store for debug
  _dbgPulseRatio = pulseRatio;
  _dbgDriveScore = driveScore;
  _dbgThreshAmb = threshAmbient;
  _dbgThreshBld = threshBuilding;
}
let _dbgPulseRatio = 1;
let _dbgDriveScore = 1;
let _dbgThreshAmb = 0.65;
let _dbgThreshBld = 1.02;

// ═══════════════════════════════════════════════════════════════
// BPM Tap (Space key)
// ═══════════════════════════════════════════════════════════════

function handleTap() {
  const now = performance.now();
  
  // Clear old taps
  if (tapTimes.length > 0 && now - tapTimes[tapTimes.length - 1] > TAP_TIMEOUT) {
    tapTimes = [];
  }
  
  tapTimes.push(now);
  
  // ── 1 TAP = SYNC (BPM already set) ───────────────────────
  if (tapTimes.length === 1 && bpm > 0) {
    beatIndex = 0;
    beatFlash = 1.0;
    beatCount++;
    startBeatClock(bpm);
    if (videoLoaded) updateVideoSpeed(bpm);
    return;
  }
  
  if (tapTimes.length < 2) return;
  
  // Keep last 12 taps
  if (tapTimes.length > 12) tapTimes.shift();
  
  // ── Calculate intervals (iOS: iv >= 250 && iv <= 1500) ────
  const intervals = [];
  for (let i = 1; i < tapTimes.length; i++) {
    const iv = tapTimes[i] - tapTimes[i - 1];
    if (iv >= 250 && iv <= 1500) intervals.push(iv);
  }
  if (intervals.length < 1) return;
  
  // ── IQR outlier rejection ─────────────────────────────────
  intervals.sort((a, b) => a - b);
  const q1 = intervals[Math.floor(intervals.length * 0.25)];
  const q3 = intervals[Math.floor(intervals.length * 0.75)];
  const iqr = q3 - q1;
  const clean = intervals.filter(v => v >= q1 - 1.5 * iqr && v <= q3 + 1.5 * iqr);
  if (clean.length < 1) return;
  
  const avg = clean.reduce((a, b) => a + b) / clean.length;
  const newBpm = Math.min(Math.max(60000 / avg, 40), 240);
  
  // ── Progressive locking (iOS 1:1) ─────────────────────────
  if (bpm === 0) {
    // First measurement
    bpm = Math.round(newBpm * 10) / 10;
  } else if (clean.length <= 3) {
    // Few taps → fast learning: 70% new
    bpm = Math.round((bpm * 0.3 + newBpm * 0.7) * 10) / 10;
  } else if (clean.length <= 8) {
    // Mid phase → gradual refinement: 30% new
    bpm = Math.round((bpm * 0.7 + newBpm * 0.3) * 10) / 10;
  } else {
    // 8+ taps → BPM locked, micro correction only: max ±2 BPM × 15%
    const diff = Math.min(Math.max(newBpm - bpm, -2.0), 2.0);
    bpm = Math.round((bpm + diff * 0.15) * 10) / 10;
  }
  
  // Beat flash on tap
  beatFlash = 1.0;
  beatIndex++;
  beatCount++;
  
  // Sync video speed
  if (videoLoaded) updateVideoSpeed(bpm);
  
  // ── Clock restart logic (iOS 1:1) ─────────────────────────
  if (clean.length <= 4) {
    // Learning phase → full restart with phase reset
    startBeatClock(bpm);
  } else {
    // Locked → update speed only, NO phase reset
    if (beatClockTimer) clearInterval(beatClockTimer);
    const intervalMs = 60000 / bpm;
    beatClockTimer = setInterval(() => onBeatTick(), intervalMs);
  }
}

// ═══════════════════════════════════════════════════════════════
// Beat Clock — timer-based, fires on every beat (from iOS)
// ═══════════════════════════════════════════════════════════════

let beatClockTimer = null;

function startBeatClock(newBpm) {
  if (beatClockTimer) clearInterval(beatClockTimer);
  if (newBpm <= 0) return;
  
  const intervalMs = 60000 / newBpm;
  
  // Reset auto-correction state
  peakSkipCount = 0;
  detectedPeakTimes = [];
  
  // Reset beatIndex on first few taps (learning phase)
  if (tapTimes.length <= 4) {
    beatIndex = 0;
  }
  
  beatClockTimer = setInterval(() => {
    onBeatTick();
  }, intervalMs);
}

function onBeatTick() {
  beatIndex++;
  beatCount++;
  moodBeatCounter++; // watchdog counter
  beatFiredFrames = 5;
  
  // Phrase detection (breakdown → drop alignment) — increment FIRST so beat cut aligns
  updatePhraseOnBeat();
  
  // Beat cut countdown — PHRASE-ALIGNED for intervals ≥ 1
  if (beatCutEnabled && beatCutInterval >= 1) {
    const phraseBeat = phraseCounter;
    const effectiveInterval = Math.floor(getOrganicInterval());
    if (phraseBeat > 0 && phraseBeat % effectiveInterval === 0) {
      beatCutNext();
    }
  }
  
  // Sub-beat support: interval < 1 = multiple cuts per beat
  if (beatCutEnabled && beatCutInterval < 1 && beatCutInterval > 0) {
    scheduleSubBeatCuts();
  }
  
  // Camera hold countdown (per beat, not per cut)
  if (camHoldBeats > 0) camHoldBeats--;
  
  // Camera beat pulse + rotation (mood-dependent range, skip in silence)
  if (PRESETS[activePreset]?.type === 'camera' && smoothVol >= 0.008) {
    camPulseScale = 1.0;
    let camRotRange = 1;
    if (mood === 'PEAK' || mood === 'DROP') camRotRange = 8;
    else if (mood === 'GROOVE') camRotRange = 5;
    else if (mood === 'BUILDING') camRotRange = 3;
    else camRotRange = 1;
    
    if (beatCutEnabled) {
      camRotTarget = camRotTarget > 0 ? -camRotRange : camRotRange;
    }
  }
  
  // Typo beat hook
  typoOnBeat();
  
  const bar4 = beatIndex % 4;
  const bar8 = beatIndex % 8;
  const bar16 = beatIndex % 16;
  
  // ── VIDEO JUMP: Scale pop on downbeats (only if preset has videoJump flag) ──
  const curPresetVJ = PRESETS[activePreset]?.videoJump;
  if (curPresetVJ && videoJumpEnabled) {
    // Mood-based scale: GROOVE = medium (1.15), DROP/PEAK = aggressive (1.3)
    // BUILDING/AMBIENT = subtle (1.08)
    let jumpScale = 1.15;
    if (mood === 'GROOVE') jumpScale = 1.25;
    else if (mood === 'DROP' || mood === 'PEAK') jumpScale = 1.45;
    
    // Instant jump on downbeats (bar4 === 0 means downbeat)
    if (bar4 === 0) {
      videoJumpScale = jumpScale;
    }
    
    // Half-beat jump during DROP/PEAK (on any bar16 === 2, 6, 10, 14 — between downbeats)
    // Actually handled by scheduleVideoHalfBeatJump() called from onBeatTick if DROP
  }
  
  // ── FX hierarchy (iOS: fx16 > fx8 > fx4 > every beat) ──────
  // driveScale (0.05-1.0) scales ALL visual intensity
  const ds = driveScale;
  if (bar16 === 0) {
    beatFlash = 1.0 * fxIntensity;
    exposureOpacity = 0.4 * fxIntensity;
    pulseScale = 1.0 + 0.35 * ds + smoothBass * 0.4 * ds;
  } else if (bar8 === 0) {
    beatFlash = 0.75 * fxIntensity;
    exposureOpacity = 0.2 * fxIntensity;
    pulseScale = 1.0 + 0.25 * ds + smoothBass * 0.3 * ds;
  } else if (bar4 === 0) {
    beatFlash = 0.5 * fxIntensity;
    exposureOpacity = 0.08 * fxIntensity;
    pulseScale = 1.0 + 0.15 * ds + smoothBass * 0.2 * ds;
  } else {
    pulseScale = 1.0 + 0.05 * ds + smoothBass * 0.1 * ds;
  }
  
  // ── Strobo (beat flash × envelope) ───────────────────────────
  // stroboEnvelope = overall brightness (auto strobo fade controls this)
  // Beat toggle creates the flicker, envelope scales it
  if (stroboActive) {
    stroboBeatToggle = !stroboBeatToggle; // flicker per beat
    stroboFlash = stroboBeatToggle ? stroboEnvelope : 0;
  } else {
    stroboBeatToggle = false;
    if (stroboFlash > 0.01) stroboFlash *= 0.65; else stroboFlash = 0; // quick fade
  }
  
  // Update video speed on every beat
  if (videoLoaded && bpm > 0) {
    updateVideoSpeed(bpm);
  }
}

// Fractional intervals: 0.5 = cut twice per beat (offbeat + downbeat)
// Uses setTimeout to fire at beat/2 point
let _subBeatTimeout = null;
function scheduleSubBeatCuts() {
  if (_subBeatTimeout) clearTimeout(_subBeatTimeout);
  if (!beatCutEnabled || beatCutInterval >= 1 || bpm <= 0) return;
  
  const beatMs = 60000 / bpm;
  // For 0.5 interval = 2 cuts per beat: fire 1 extra cut at half-beat
  // For 0.25 interval = 4 cuts per beat: fire 3 extra cuts at quarter-beat intervals
  const cutsPerBeat = Math.round(1 / beatCutInterval);
  
  // Fire cuts at 1/cutsPerBeat, 2/cutsPerBeat, ... (skip 0 = onbeat handled above)
  const msBetween = beatMs / cutsPerBeat;
  
  let fired = 0;
  const total = cutsPerBeat - 1; // 0.5 → 1 extra, 0.25 → 3 extra
  
  // Fire the onbeat cut NOW (since this is called from onBeatTick, onbeat already past)
  beatCutNext();
  
  const fireNext = () => {
    if (!beatCutEnabled || beatCutInterval >= 1) return; // user changed interval
    if (fired >= total) return;
    fired++;
    beatCutNext();
    _subBeatTimeout = setTimeout(fireNext, msBetween);
  };
  _subBeatTimeout = setTimeout(fireNext, msBetween);
}

// Autopilot = organic variation. Manual = exact interval.
function getOrganicInterval() {
  if (!autopilotEnabled) return beatCutInterval; // manual = exact
  
  const base = beatCutInterval;
  // Only vary intervals >= 2 (smaller ones are already fast)
  if (base < 2) return base;
  
  const variation = Math.floor(Math.random() * 3) - 1; // -1, 0, or +1
  return Math.max(2, base + variation);
}

// ── Silence detection → dampen FX ─────────────────────────────
function updateSilenceDampen() {
  const target = Math.min(fxSliderValue * driveScale, driveScale);
  if (smoothVol > SILENCE_THRESHOLD) {
    silenceTimer = 0;
    fxIntensity = fxIntensity * 0.75 + target * 0.25; // was 0.9/0.1 — 2.5× faster
  } else {
    silenceTimer++;
    if (silenceTimer > SILENCE_DAMPEN_AFTER) {
      fxIntensity = fxIntensity * 0.92 + (0.15 * target) * 0.08;
    }
  }
  fxIntensity = Math.min(fxIntensity, driveScale);
}

// ═══════════════════════════════════════════════════════════════
// Autopilot — Feature container (toggleable sub-features)
// ═══════════════════════════════════════════════════════════════

let autopilotEnabled = false;       // master toggle
// Theme mix: which themes autopilot uses + weight ratios
let activeThemes = { omen: true, camera: false, voyager: false, typo: false };
let themeWeights = { omen: 80, camera: 20, voyager: 0, typo: 30 };
let _themeCheckCounter = 0;
let autoEnergyEnabled = true;       // sub: energy-based preset switch
let autoFxEnabled = true;           // sub: FX amount driven by volume
let autoBeatCutEnabled = false;     // sub: auto manages beat cut (default OFF — user controls manually)
let autoStroboEnabled = true;       // sub: strobo on cymbal/crash detect
let autoColorEnabled = true;        // sub: color palette by mood
let autoSpeedEnabled = true;        // sub: video speed by energy

let lastAutopilotMood = '';
let autopilotCooldown = 0;
const AUTOPILOT_MIN_INTERVAL = 600;

// Auto strobo state
let highAvg = 0;          // running high-freq average (ratchet)
let highPeakBuffer = [];  // last 5 frames raw high values
let stroboAutoFrames = 0; // frames remaining for auto-strobo burst

// Helper: get theme for any preset (handles missing themeId)
function getPresetTheme(p) {
  if (p?.themeId) return p.themeId;
  if (p?.type === 'camera') return 'camera';
  return 'omen';
}

function getPresetsByEnergy(cat) {
  return PRESETS.map((p, i) => ({ ...p, idx: i }))
    .filter(p => {
      if (p.energy !== cat) return false;
      if (!presetReady[p.idx] || !presetPool.has(p.idx)) return false;
      if (!activeThemes[getPresetTheme(p)]) return false;
      if (!isCamPresetLive(p.idx)) return false;
      return true;
    });
}

// Get all eligible presets from active themes (any energy)
function getActiveThemePresets() {
  return PRESETS.map((p, i) => ({ ...p, idx: i }))
    .filter(p => {
      if (!presetReady[p.idx] || !presetPool.has(p.idx)) return false;
      if (!activeThemes[getPresetTheme(p)]) return false;
      if (!isCamPresetLive(p.idx)) return false;
      return true;
    });
}

// Weighted random pick from presets based on theme weights
// Two-step: pick THEME by weight, then preset within theme
function weightedPresetPick(candidates) {
  if (candidates.length === 0) return null;
  
  // Group by theme
  const groups = {};
  candidates.forEach(p => {
    const theme = getPresetTheme(p);
    if (!groups[theme]) groups[theme] = [];
    groups[theme].push(p);
  });
  
  const themeIds = Object.keys(groups);
  if (themeIds.length === 0) return null;
  if (themeIds.length === 1) {
    const presets = groups[themeIds[0]];
    return presets[Math.floor(Math.random() * presets.length)];
  }
  
  // Weighted random: pick theme
  let totalWeight = 0;
  const weighted = themeIds.map(id => {
    const w = themeWeights[id] || 10;
    totalWeight += w;
    return { id, w, presets: groups[id] };
  });
  
  let r = Math.random() * totalWeight;
  let picked = weighted[0];
  for (const t of weighted) {
    r -= t.w;
    if (r <= 0) { picked = t; break; }
  }
  
  // Random preset within picked theme
  return picked.presets[Math.floor(Math.random() * picked.presets.length)];
}

// Map normEnergy to beat cut interval
function getAutoBeatCutInterval() {
  const driveN = masterDrive / 100;
  
  let interval = 4;
  if (mood === 'LISTENING') return 0; // beat cut OFF only for LISTENING (startup state)
  if (mood === 'AMBIENT') interval = 16; // slow cut once per phrase
  if (mood === 'BUILDING') interval = 8;
  if (mood === 'GROOVE') interval = 4;
  if (mood === 'DROP' || mood === 'PEAK') interval = 2;
  
  // Drive only scales up/down subtly
  if (driveN < 0.3) interval = Math.min(interval * 2, 32);
  else if (driveN > 0.8) interval = Math.max(Math.floor(interval / 2), 2);
  
  return interval;
}

function updateAutopilot() {
  if (!autopilotEnabled) return;
  
  // ── SILENCE GUARD: no audio = AMBIENT mood + kill beat cut/strobo ──
  if (smoothVol < 0.03) {
    if (mood !== 'AMBIENT') {
      mood = 'AMBIENT';
      moodCandidate = 'AMBIENT';
      lastAutopilotMood = '';
      autopilotCooldown = 0;
      updatePresetGrid();
      
      // Switch to CAT 1 preset if current isn't CAT 1 (only OMEN video/gfx presets)
      const curType = PRESETS[activePreset]?.type || 'video';
      const curIsOmen = (curType === 'video' || curType === 'gfx');
      const curCat = PRESETS[activePreset]?.energy || 2;
      if (curIsOmen && curCat !== 1) {
        const cat1 = PRESETS.map((p, i) => ({ p, i }))
          .filter(x => (x.p.type === 'video' || x.p.type === 'gfx') && (x.p.energy || 2) === 1 && presetReady[x.i]);
        if (cat1.length > 0) {
          switchToPreset(cat1[0].i);
        }
      }
    }
    if (beatCutEnabled && autoBeatCutEnabled) { beatCutEnabled = false; updatePresetGrid(); }
    if (stroboActive && !manualStrobo) { stroboActive = false; stroboFlash = 0; }
    return;
  }
  
  // ── Sub-feature: FX AMOUNT (runs every frame) ───────────────
  if (autoFxEnabled) {
    const targetFx = 0.3 + smoothVol * 2.4;
    fxSliderValue = fxSliderValue * 0.95 + Math.min(targetFx, 2.0) * 0.05;
  }
  
  // ── Sub-feature: AUTO STROBO (cymbal/crash detection) ───────
  if (autoStroboEnabled) {
    // Use RAW high (not smoothed) — crashes are transients
    if (high > highAvg) {
      highAvg = highAvg * 0.999 + high * 0.001;
    } else {
      highAvg = highAvg * 0.9999 + high * 0.0001;
    }
    
    // Peak tracker: max high in last 5 frames
    highPeakBuffer.push(high);
    if (highPeakBuffer.length > 5) highPeakBuffer.shift();
    const highPeak = Math.max(...highPeakBuffer);
    
    const highRatio = highAvg > 0.002 ? highPeak / highAvg : 1.0;
    
    // Crash/open hat: variable duration by intensity
    // highRatio 1.3 = tiny flash (3 frames), 2.0+ = full burst (10 frames)
    // Drive gates auto-strobo: below 30% drive, no auto strobo
    if (highRatio > 1.3 && driveScale > 0.3) {
      const intensity = Math.min((highRatio - 1.3) / 0.7, 1.0);
      const duration = Math.round(3 + intensity * 7);
      if (duration > stroboAutoFrames) {
        stroboAutoFrames = duration;
        stroboMaxFrames = duration;
      }
    }
    
    if (stroboAutoFrames > 0) {
      stroboAutoFrames--;
      if (!stroboActive) stroboActive = true;
      
      const progress = 1.0 - (stroboAutoFrames / Math.max(stroboMaxFrames, 1));
      if (progress < 0.6) {
        stroboEnvelope = 0.85 * driveScale;
      } else {
        stroboEnvelope = 0.85 * driveScale * (1.0 - (progress - 0.6) / 0.4);
      }
      // Auto strobo: set flash DIRECTLY per frame (don't wait for onBeatTick)
      stroboBeatToggle = !stroboBeatToggle;
      stroboFlash = stroboBeatToggle ? stroboEnvelope : 0;
    } else {
      if (stroboActive && !manualStrobo) {
        stroboActive = false;
        stroboFlash = 0;
        stroboEnvelope = 0.85 * driveScale; // reset for next burst
      }
    }
  }
  
  // ── Sub-feature: BEAT CUT interval (runs every frame) ───────
  if (autoBeatCutEnabled) {
    const autoInterval = getAutoBeatCutInterval();
    if (autoInterval === 0) {
      // AMBIENT → beat cut OFF
      if (beatCutEnabled) { beatCutEnabled = false; updatePresetGrid(); }
    } else {
      const wasOff = !beatCutEnabled;
      beatCutEnabled = true;
      if (beatCutInterval !== autoInterval) {
        beatCutInterval = autoInterval;
        if (wasOff) {
          beatCutWaitForDownbeat = cdjConnected;
          beatCutCountdown = autoInterval;
        } else {
          beatCutCountdown = Math.min(beatCutCountdown, autoInterval);
        }
      }
      // Only rebuild pool + refresh grid when beat cut first turns ON
      if (wasOff) {
        const allActive = PRESETS.map((p, i) => i).filter(i => {
          if (!presetReady[i]) return false;
          if (!presetPool.has(i)) return false;
          const theme = getPresetTheme(PRESETS[i]);
          if (!activeThemes[theme]) return false;
          if (!isCamPresetLive(i)) return false;
          return true;
        });
        if (allActive.length >= 2) {
          beatCutActive = new Set(allActive);
        }
        updatePresetGrid();
      }
    }
  }
  
  // ── Sub-feature: AUTO SPEED (energy → 1× or 2×) ─────────────
  if (autoSpeedEnabled) {
    const targetSpeed = (mood === 'DROP' || mood === 'PEAK') ? 2.0 : 1.0;
    if (videoSpeedMultiplier !== targetSpeed) {
      setVideoSpeed(targetSpeed);
    }
  }
  
  // ── Sub-feature: ENERGY preset switch ───
  // ONLY active when beat cut is running
  if (!autoEnergyEnabled) return;
  if (!beatCutEnabled) return; // NO preset switching without beat cut
  if (autopilotCooldown > 0) { autopilotCooldown--; return; }
  
  if (mood === lastAutopilotMood) return;
  lastAutopilotMood = mood;
  
  // ── Sub-feature: AUTO COLOR (change palette on mood switch) ──
  if (autoColorEnabled) {
    const moodPalettes = {
      'AMBIENT': [1, 4],
      'LISTENING': [1, 4],
      'BUILDING': [1, 2],
      'GROOVE': [0, 3],
      'DROP': [3, 4],
      'PEAK': [0, 3, 4],
    };
    const moodChoices = moodPalettes[mood] || [0];
    const poolChoices = moodChoices.filter(c => colorPool.has(c));
    const choices = poolChoices.length > 0 ? poolChoices : [...colorPool];
    if (choices.length > 0) {
      const colorFiltered = choices.filter(c => c !== colorIndex);
      const newColor = colorFiltered.length > 0 
        ? colorFiltered[Math.floor(Math.random() * colorFiltered.length)]
        : choices[0];
      setColor(newColor);
    }
  }
  
  // Beat cut does the preset switching via beatCutNext()
  // Color is handled above, nothing else to do here
  updatePresetGrid();
  autopilotCooldown = AUTOPILOT_MIN_INTERVAL;
}

// ═══════════════════════════════════════════════════════════════
// Auto BPM Correction — detected peaks refine tapped BPM
// ═══════════════════════════════════════════════════════════════

let detectedPeakTimes = [];
const PEAK_HISTORY = 16;
const MAX_CORRECTION = 2.0; // max ±2 BPM drift
const CORRECTION_RATE = 0.08; // 8% per correction step
let peakSkipCount = 0; // skip first 2 after clock start

function autoCorrectBpm() {
  const now = performance.now();
  
  // Skip first 2 detected peaks — usually off-beat
  peakSkipCount++;
  if (peakSkipCount <= 2) return;
  
  // Log detected peak
  detectedPeakTimes.push(now);
  if (detectedPeakTimes.length > PEAK_HISTORY) detectedPeakTimes.shift();
  if (detectedPeakTimes.length < 6) return; // need enough data
  
  // Calculate average peak interval
  const intervals = [];
  for (let i = 1; i < detectedPeakTimes.length; i++) {
    intervals.push(detectedPeakTimes[i] - detectedPeakTimes[i - 1]);
  }
  
  // IQR filter (reject outliers)
  intervals.sort((a, b) => a - b);
  const q1 = intervals[Math.floor(intervals.length * 0.25)];
  const q3 = intervals[Math.floor(intervals.length * 0.75)];
  const iqr = q3 - q1;
  const clean = intervals.filter(v => v >= q1 - 1.5 * iqr && v <= q3 + 1.5 * iqr);
  if (clean.length < 3) return;
  
  const avgInterval = clean.reduce((a, b) => a + b) / clean.length;
  const detectedBpm = 60000 / avgInterval;
  
  // Only correct if detected BPM is close to current (within ±15 BPM)
  // Prevents correction from noise or half/double time
  if (Math.abs(detectedBpm - bpm) > 15) return;
  
  // Nudge toward detected BPM
  const delta = (detectedBpm - bpm) * CORRECTION_RATE;
  const clampedDelta = Math.max(-MAX_CORRECTION * CORRECTION_RATE, 
                       Math.min(MAX_CORRECTION * CORRECTION_RATE, delta));
  
  const newBpm = Math.round((bpm + clampedDelta) * 10) / 10;
  
  if (newBpm !== bpm) {
    bpm = newBpm;
    // Restart clock with corrected BPM (preserve phase — don't reset beatIndex)
    if (beatClockTimer) clearInterval(beatClockTimer);
    const intervalMs = 60000 / bpm;
    beatClockTimer = setInterval(() => onBeatTick(), intervalMs);
    
    if (videoLoaded) updateVideoSpeed(bpm);
  }
}

// ═══════════════════════════════════════════════════════════════
// Video Preset A/B System — Hardcoded Registry (like iOS)
// ═══════════════════════════════════════════════════════════════

function initPresets() {
  // Set initial vignette
  document.getElementById('videoVignette').style.background = 
    'radial-gradient(circle closest-side, transparent 0%, transparent 40%, rgba(0,0,0,0.08) 52%, rgba(0,0,0,0.25) 62%, rgba(0,0,0,0.50) 72%, rgba(0,0,0,0.75) 82%, rgba(0,0,0,0.92) 92%, rgba(0,0,0,1.0) 100%)';
  
  // ── Generate video elements (ONE per preset, no A/B) ────────
  const videoLayer = document.getElementById('videoLayer');
  videoLayer.innerHTML = '';
  PRESETS.forEach((preset, i) => {
    if (!preset.videoA) return; // GFX-only preset (OMEN1)
    const v = document.createElement('video');
    v.id = `vid${i}`;
    v.loop = true; v.muted = true; v.playsInline = true;
    v.setAttribute('playsinline', '');
    videoLayer.appendChild(v);
  });
  
  // ── Generate preset buttons ─────────────────────────────────
  const presetBtns = document.getElementById('presetBtns');
  presetBtns.innerHTML = '';
  PRESETS.forEach((preset, i) => {
    const btn = document.createElement('div');
    btn.id = 'pg' + i;
    btn.className = 'pgrid' + (i === 0 ? ' active' : '');
    btn.textContent = preset.name.replace('OMEN', '');
    btn.style.cursor = 'pointer';
    btn.onclick = () => handlePresetClick(i);
    presetBtns.appendChild(btn);
  });
  
  applyVideoColor();
  updateColorDots();
  
  // ── Load videos ─────────────────────────────────────────────
  PRESETS.forEach((preset, i) => {
    if (!preset.videoA || preset.type === 'camera') {
      presetReady[i] = true;
      return;
    }
    
    const vid = document.getElementById(`vid${i}`);
    if (!vid) return;
    vid.src = preset.videoA;
    
    vid.oncanplaythrough = () => {
      if (presetReady[i]) return;
      vid.play().catch(() => {});
      checkPresetReady(i);
    };
    vid.onerror = () => { console.warn(`${preset.videoA} not found`); checkPresetReady(i); };
    
    setTimeout(() => {
      if (!presetReady[i]) {
        console.warn(`${preset.name} video timeout — marking ready (GFX only)`);
        checkPresetReady(i);
      }
    }, 8000);
    
    vid.load();
  });
}

function checkPresetReady(idx) {
  presetReady[idx] = true;
  videoLoaded = true;
  
  updateVideoVisibility();
  updatePresetGrid();
}

// BPM → playback speed: video synced to beats
function updateVideoSpeed(newBpm) {
  if (newBpm <= 0) return;
  
  const targetSeconds = (VIDEO_SYNC_BEATS * 60.0) / newBpm;
  const speed = Math.min(Math.max((VIDEO_DURATION_S / targetSeconds) * videoSpeedMultiplier, 0.1), 8.0);
  
  if (Math.abs(speed - videoSpeed) < 0.01) return;
  videoSpeed = speed;
  
  PRESETS.forEach((preset, i) => {
    if (!preset.videoA) return;
    const v = document.getElementById(`vid${i}`);
    if (v && v.readyState >= 2) v.playbackRate = speed;
  });
}

// Camera CSS filters (static — defined once)
const CAM_FILTERS = [
  'sepia(0.6) hue-rotate(-10deg) saturate(2.5)',
  'sepia(0.6) hue-rotate(200deg) saturate(2.5)',
  'sepia(0.6) hue-rotate(100deg) saturate(2.5)',
  'sepia(0.6) hue-rotate(40deg) saturate(2.5)',
  'saturate(0)',
];

// Cached DOM refs (set once)
let _vlEl = null, _clEl = null, _coEl = null, _vigEl = null;
let _lastActivePreset = -1;

function updateVideoVisibility() {
  const currentPreset = PRESETS[activePreset];
  const currentPresetHasVideo = currentPreset?.videoA != null;
  const currentPresetIsCamera = currentPreset?.type === 'camera';
  
  // Cache DOM refs on first call
  if (!_vlEl) _vlEl = document.getElementById('videoLayer');
  if (!_clEl) _clEl = document.getElementById('cameraLayer');
  if (!_coEl) _coEl = document.getElementById('camColorOverlay');
  
  // Video layer opacity
  if (_vlEl) _vlEl.style.opacity = (currentPresetHasVideo && !currentPresetIsCamera && !videoHidden) ? '1' : '0';
  
  // Hide overlay div (unused)
  if (_coEl && _coEl.style.display !== 'none') _coEl.style.display = 'none';
  
  // ═══ CAMERA: exactly ONE source visible, all others HIDDEN ═══
  // Step 1: HIDE EVERYTHING camera-related first
  if (_clEl) _clEl.style.display = 'none';
  Object.keys(localCams).forEach(pidx => {
    const cam = localCams[pidx];
    if (cam && cam.videoEl) cam.videoEl.style.display = 'none';
  });
  
  // Step 2: Show ONE source if camera preset is active
  if (currentPresetIsCamera && !videoHidden) {
    const camSource = currentPreset?.camSource || 'remote';
    const camFilter = CAM_FILTERS[colorIndex] || CAM_FILTERS[0];
    const isSilence = smoothVol < 0.03;
    const t = performance.now() / 1000;
    
    let rot = 0;
    let camScale = pinchScale;
    
    if (!isSilence) {
      // Audio active: pulse + rotation
      const activePulse = camPulseScale > 0.05 ? camPulseScale : (Math.sin(t * 3) * 0.5 + 0.5) * 0.3;
      let driftRange = 1;
      if (mood === 'PEAK' || mood === 'DROP') driftRange = 5;
      else if (mood === 'GROOVE') driftRange = 3;
      else if (mood === 'BUILDING') driftRange = 2;
      else driftRange = 1;
      rot = beatCutEnabled ? camRotCurrent : Math.sin(t * 0.4) * driftRange;
      const breathe = 1.0 + smoothVol * 0.15;
      const pulse = 1.0 + activePulse * 0.22;
      camScale = breathe * pulse * pinchScale;
    }
    // Silence: rot=0, camScale=pinchScale (static)
    
    const transformStr = `translate(-50%, -50%) scale(${camScale.toFixed(3)}) rotate(${rot.toFixed(1)}deg)`;
    
    if (camSource === 'local' && localCams[activePreset]?.videoEl) {
      // LOCAL camera: show this preset's video element
      const el = localCams[activePreset].videoEl;
      el.style.display = 'block';
      el.style.transform = transformStr;
      el.style.filter = camFilter;
    } else if (remoteCamActive && _clEl) {
      // REMOTE camera: show shared canvas
      _clEl.style.display = 'block';
      _clEl.style.transform = transformStr;
      _clEl.style.filter = camFilter;
    }
  } else if (!currentPresetIsCamera && _clEl) {
    _clEl.style.filter = 'none';
    applyVideoColor();
  }
  
  // ── Video toggle (only when preset changes) ──
  if (activePreset !== _lastActivePreset) {
    // Deactivate previous — hide only, keep playing
    if (_lastActivePreset >= 0 && _lastActivePreset !== activePreset) {
      const prev = document.getElementById(`vid${_lastActivePreset}`);
      if (prev) prev.classList.remove('active');
    }
    // Activate current + ensure playing
    if (presetReady[activePreset] && PRESETS[activePreset]?.videoA) {
      const cur = document.getElementById(`vid${activePreset}`);
      if (cur) {
        cur.style.transform = _lastVideoTransform;
        if (cur.paused) cur.play().catch(()=>{});
        cur.classList.add('active');
      }
    }
    _lastActivePreset = activePreset;
  }
}

// ── Local Camera Management ────────────────────────────────────
let availableCameras = []; // list of { deviceId, label } for controller

async function enumerateLocalCameras() {
  try {
    const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
    tempStream.getTracks().forEach(t => t.stop());
    const devices = await navigator.mediaDevices.enumerateDevices();
    availableCameras = devices.filter(d => d.kind === 'videoinput').map(d => ({
      deviceId: d.deviceId,
      label: d.label || 'Camera ' + d.deviceId.slice(0, 8),
    }));
    console.log('[CAM] Found', availableCameras.length, 'cameras');
  } catch (err) {
    console.warn('[CAM] Cannot enumerate cameras:', err.message);
  }
}

async function openLocalCam(presetIdx, deviceId) {
  if (localCams[presetIdx]) return; // already open
  
  try {
    // Use provided deviceId, or first available
    if (!deviceId && availableCameras.length > 0) {
      deviceId = availableCameras[0].deviceId;
    }
    if (!deviceId) {
      await enumerateLocalCameras();
      if (availableCameras.length > 0) deviceId = availableCameras[0].deviceId;
    }
    if (!deviceId) return;
    
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { deviceId: { exact: deviceId }, width: { ideal: 720 }, height: { ideal: 720 } }
    });
    
    const videoEl = document.createElement('video');
    videoEl.srcObject = stream;
    videoEl.muted = true;
    videoEl.playsInline = true;
    videoEl.setAttribute('playsinline', '');
    videoEl.style.cssText = 'position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:100vh; height:100vh; object-fit:cover; z-index:0; display:none;';
    videoEl.id = 'localCam' + presetIdx;
    document.body.insertBefore(videoEl, document.getElementById('videoVignette'));
    await videoEl.play();
    
    localCams[presetIdx] = { stream, videoEl, deviceId };
    console.log('[CAM] Local camera opened for preset', presetIdx);
  } catch (err) {
    console.warn('[CAM] Local camera error:', err.message);
  }
}

// Enumerate cameras after 3s delay (only if local camera presets exist)
setTimeout(() => {
  const hasLocalCam = PRESETS.some(p => p.type === 'camera' && p.camSource === 'local');
  if (hasLocalCam) enumerateLocalCameras();
}, 3000);

let lastSwitchTime = 0;
const SWITCH_MIN_MS = 300; // minimum 300ms between switches

function switchToPreset(idx) {
  if (!presetReady[idx]) return;
  
  // Throttle beat cut (not manual clicks)
  const now = performance.now();
  if (now - lastSwitchTime < SWITCH_MIN_MS && beatCutEnabled) return;
  lastSwitchTime = now;
  
  activePreset = idx;
  
  const preset = PRESETS[idx];
  
  // Local camera preset → open camera if needed
  if (preset?.type === 'camera' && preset?.camSource === 'local') {
    openLocalCam(idx, preset?.deviceId || null);
  }
  
  // Ensure video is playing (playbackRate set elsewhere)
  if (preset && preset.videoA && preset.type !== 'camera') {
    const v = document.getElementById(`vid${idx}`);
    if (v) {
      v.playbackRate = videoSpeed || 1;
      if (v.paused) v.play().catch(()=>{});
    }
  }
  
  updateVideoVisibility();
  updatePresetGrid();
}

// Check if a camera preset has an active stream
function isCamPresetLive(idx) {
  const p = PRESETS[idx];
  if (p?.type !== 'camera') return true; // not camera = always OK
  const src = p?.camSource || 'remote';
  if (src === 'remote') {
    if (!remoteCamActive) return false;
    // Only FIRST remote camera preset is "live" — they all share one canvas
    const firstRemoteIdx = PRESETS.findIndex(pr => pr?.type === 'camera' && (pr?.camSource || 'remote') === 'remote');
    return idx === firstRemoteIdx;
  }
  return !!localCams[idx]; // local cam open
}

function getLoadedPresets() {
  return PRESETS.map((_, i) => i).filter(i => {
    if (!presetReady[i]) return false;
    if (!beatCutActive.has(i)) return false;  // user X in beat cut mode
    if (!presetPool.has(i)) return false;     // drive auto-deselect + user X in autopilot
    const theme = getPresetTheme(PRESETS[i]);
    if (!activeThemes[theme]) return false;
    if (!isCamPresetLive(i)) return false;
    return true;
  });
}

// Two-step selection: pick THEME by weight, then random preset within theme
function pickByThemeWeight(candidates) {
  if (candidates.length === 0) return null;
  
  // Group by theme
  const groups = {};
  candidates.forEach(idx => {
    const p = typeof idx === 'number' ? PRESETS[idx] : idx;
    const i = typeof idx === 'number' ? idx : idx.idx;
    const theme = getPresetTheme(p);
    if (!groups[theme]) groups[theme] = [];
    groups[theme].push(i);
  });
  
  // Weighted random pick of theme
  const themeIds = Object.keys(groups);
  if (themeIds.length === 0) return null;
  if (themeIds.length === 1) {
    const presets = groups[themeIds[0]];
    return presets[Math.floor(Math.random() * presets.length)];
  }
  
  let totalWeight = 0;
  const weighted = themeIds.map(id => {
    const w = themeWeights[id] || 10;
    totalWeight += w;
    return { id, w, presets: groups[id] };
  });
  
  let r = Math.random() * totalWeight;
  let picked = weighted[0];
  for (const t of weighted) {
    r -= t.w;
    if (r <= 0) { picked = t; break; }
  }
  
  // Random preset within picked theme
  return picked.presets[Math.floor(Math.random() * picked.presets.length)];
}

let camHoldBeats = 0;

function beatCutNext() {
  // Camera hold: don't switch away from camera
  if (camHoldBeats > 0) return;
  
  const loaded = getLoadedPresets();
  if (loaded.length < 2) return;
  
  const currentIsCamera = PRESETS[activePreset]?.type === 'camera';
  const currentCamSource = PRESETS[activePreset]?.camSource || 'remote';
  
  // Filter: avoid current preset
  let others = loaded.filter(i => i !== activePreset);
  
  // After camera: prefer non-camera
  if (currentIsCamera) {
    const nonCam = others.filter(i => PRESETS[i]?.type !== 'camera');
    if (nonCam.length > 0) {
      others = nonCam;
    } else {
      others = others.filter(i => (PRESETS[i]?.camSource || 'remote') !== currentCamSource);
      if (others.length === 0) return;
    }
  }
  
  let pick;
  
  if (autopilotEnabled) {
    // AUTOPILOT = STRICT energy filter (only target category)
    let targetCat = 3;
    if (mood === 'AMBIENT' || mood === 'LISTENING') targetCat = 1;
    else if (mood === 'BUILDING') targetCat = 2;
    
    const energyMatched = others.filter(i => (PRESETS[i]?.energy || 2) === targetCat);
    // If no presets in target CAT, fallback to nearest
    let pool = energyMatched;
    if (pool.length === 0) {
      pool = others.filter(i => Math.abs((PRESETS[i]?.energy || 2) - targetCat) === 1);
    }
    if (pool.length === 0) pool = others; // last resort
    pick = pickByThemeWeight(pool);
  } else {
    // MANUAL beat cut = equal random cut on all presets in beatCutActive
    pick = others[Math.floor(Math.random() * others.length)];
  }
  
  if (pick === null || pick === undefined) return;
  
  if (PRESETS[pick]?.type === 'camera') camHoldBeats = 8;
  
  switchToPreset(pick);
}

// iOS-style: beat cut ON = toggle in/out of pool, OFF = instant switch
function handlePresetClick(idx) {
  if (!presetReady[idx]) return;
  
  if (beatCutEnabled) {
    if (beatCutActive.has(idx)) {
      const remaining = [...beatCutActive].filter(i => i !== idx);
      if (remaining.length >= 1) beatCutActive.delete(idx);
    } else {
      beatCutActive.add(idx);
    }
    beatCutSequenceIdx = 0;
  } else {
    switchToPreset(idx);
  }
  updatePresetGrid();
}

let _videoSyncCounter = 0;

function updateVideoLayer() {
  const currentPreset = PRESETS[activePreset];
  const hasVideo = currentPreset && currentPreset.videoA != null;
  
  // ── Auto-rotation — friction-based (never accumulates forever) ──
  const drift = (smoothBass * 0.003 - smoothMid * 0.001) * driveScale;
  compassTarget += drift;
  compassTarget *= 0.998; // FRICTION: slowly returns to 0 (half-life ~5 sec)
  // CAP: max ±0.5 rad (~28°) — prevents runaway rotation
  compassTarget = Math.max(-0.5, Math.min(0.5, compassTarget));
  compassAngle += (compassTarget - compassAngle) * 0.015;
  
  const isCamera = currentPreset && currentPreset.type === 'camera';
  
  if (!hasVideo && !isCamera || !videoLoaded && !isCamera) {
    // GFX-only — still update visibility (deactivate old videos)
    updateVideoVisibility();
    return;
  }
  
  if (isCamera) {
    // Camera preset — skip video transforms, just update visibility
    updateVideoVisibility();
    return;
  }
  
  // Video transform — bass breathing + pulse + jump
  // Base 1.08 = always covers viewport (even with rotation up to ~15°)
  const videoPulse = 1.0 + (pulseScale - 1.0) * 0.25;
  const videoScale = (1.08 + smoothBass * 0.04 * driveScale) * pinchScale * videoPulse * videoJumpScale;
  
  // Rotation: smooth follow, faster than before (was 0.03)
  videoCompassAngle = videoCompassAngle * 0.92 + compassAngle * 0.08;
  
  const transform = `translate(-50%, -50%) scale(${videoScale.toFixed(4)}) rotate(${videoCompassAngle.toFixed(4)}rad)`;
  _lastVideoTransform = transform;
  
  // VISIBILITY FIRST — toggle classes before applying transforms
  updateVideoVisibility();
  
  // Apply transform AFTER visibility toggle (no flash of old transform)
  const vid = document.getElementById(`vid${activePreset}`);
  if (vid) vid.style.transform = transform;
  
  // Vignette follows video transform (scale + rotation — never exposes corners)
  if (!_vigEl) _vigEl = document.getElementById('videoVignette');
  if (_vigEl) _vigEl.style.transform = transform;
}

let _lastGridCat = null; // track last displayed CAT to prevent flicker

function updatePresetGrid() {
  // Calculate target CAT from mood (GROOVE/DROP/PEAK all = CAT 3, no flicker between them)
  let targetCat = null;
  if (autopilotEnabled && beatCutEnabled) {
    if (mood === 'AMBIENT' || mood === 'LISTENING') targetCat = 1;
    else if (mood === 'BUILDING') targetCat = 2;
    else targetCat = 3; // GROOVE, DROP, PEAK all = CAT 3
  }
  
  // Only refresh grid styling when CAT actually changes (prevents flicker)
  const catChanged = targetCat !== _lastGridCat;
  if (catChanged) _lastGridCat = targetCat;
  
  PRESETS.forEach((preset, i) => {
    const el = document.getElementById('pg' + i);
    if (!el) return;
    el.className = 'pgrid';
    
    if (i === activePreset) {
      el.classList.add('active');
    } else if (beatCutEnabled && !beatCutActive.has(i)) {
      // User manually excluded
      el.classList.add('excluded');
    } else if (beatCutEnabled && targetCat !== null) {
      // Autopilot: dim non-target CAT
      const cat = preset.energy || 2;
      const type = preset.type || 'video';
      const isOmen = (type === 'video' || type === 'gfx');
      if (isOmen && cat !== targetCat) {
        el.classList.add('excluded');
      } else if (presetReady[i]) {
        el.classList.add('bc-active');
      }
    } else if (beatCutEnabled && presetReady[i]) {
      // Manual beat cut (no autopilot) — all in pool are active
      el.classList.add('bc-active');
    } else if (presetReady[i]) {
      el.classList.add('loaded');
    }
  });
  
  const bcEl = document.getElementById('bcToggle');
  bcEl.textContent = beatCutEnabled ? 'CUT ON' : 'CUT OFF';
  bcEl.className = 'pgrid' + (beatCutEnabled ? ' cut-on' : '');
  
  // Highlight active interval button (HUD is hidden; safe null checks)
  [1, 2, 4, 8].forEach(n => {
    const el = document.getElementById('bci' + n);
    if (el) el.className = 'pgrid' + (beatCutInterval === n ? ' active' : '');
  });
  
  updateColorDots();
}

// ═══════════════════════════════════════════════════════════════
// Canvas GFX Rendering (iOS OmenPainter port)
// ═══════════════════════════════════════════════════════════════

// Animation time for wave variation
let animTime = 0;

// GFX renders at full viewport scale — overlays on top of masked video
const GFX_SCALE = 1.0;

// Mirrored FFT: maps i around circle symmetrically (0→half = low→high, half→count = high→low)
function getMirroredFft(i, count, startBin, endBin) {
  const half = count / 2;
  const t = i < half ? i / half : (count - i) / half; // 0→1→0
  const fftLen = freqData ? freqData.length : 1;
  const idx = Math.floor(startBin * fftLen + t * (endBin - startBin) * fftLen);
  return freqData ? (freqData[Math.min(idx, fftLen - 1)] / 255) : 0;
}

// Helper: hex color to rgb array
function hexRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

// Helper: lerp color
function lerpColor(c1, c2, t) {
  const a = hexRgb(c1), b = hexRgb(c2);
  return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
}

function render() {
  const pal = palettes[colorIndex];
  const preset = PRESETS[activePreset] || {};
  const gfx = preset.gfx || 'video_rings';
  const hasVideo = preset.videoA != null;
  animTime += 0.016;
  
  // ── Reset transform to clean state every frame ──────────────
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  
  // Is current preset camera type?
  const isCurrentCam = PRESETS[activePreset]?.type === 'camera' && (remoteCamActive || localCams[activePreset]);
  
  // Clear — transparent over video/camera, black for GFX-only
  if ((hasVideo || isCurrentCam) && !videoHidden) {
    ctx.clearRect(0, 0, W, H);
  } else {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }
  
  // Compass update done in updateVideoLayer
  
  if (gfx === 'omen1_full') {
    renderOmen1(pal);
  } else if (gfx === 'beat_circles') {
    renderBeatCircles(pal);
  } else if (gfx === 'dot_matrix') {
    renderDotMatrix(pal);
  } else if (gfx === 'crosshair') {
    renderCrosshair(pal);
  } else if (gfx === 'data_scope') {
    renderDataScope(pal);
  } else if (gfx === 'text_overlay') {
    renderTextOverlay(pal);
  } else if (gfx === 'typo') {
    renderTypo(pal);
  } else {
    renderVideoRings(pal);
  }
  
  // ── Beat flash overlay ──────────────────────────────────────
  if (beatFlash > 0.01) {
    const [r, g, b] = hexRgb(pal[2]);
    ctx.fillStyle = `rgba(${r},${g},${b},${(beatFlash * 0.7).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
  }
  
  // ── Exposure glow ─────────────────────────────────────────
  if (exposureOpacity > 0.005) {
    const minD = Math.min(W, H);
    const expGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, minD * 0.5);
    expGrad.addColorStop(0, `rgba(255,255,255,${exposureOpacity * 0.8})`);
    expGrad.addColorStop(0.4, `rgba(255,255,255,${exposureOpacity * 0.3})`);
    expGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = expGrad;
    ctx.fillRect(0, 0, W, H);
  }
  
  // ── Canvas vignette (only for GFX-only presets, NOT video/camera) ───
  if ((!hasVideo && !isCurrentCam) || videoHidden) {
    const minD = Math.min(W, H);
    const grad = ctx.createRadialGradient(CX, CY, minD * 0.35, CX, CY, Math.max(W, H) * 0.55);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(0.5, 'rgba(0,0,0,0.3)');
    grad.addColorStop(0.8, 'rgba(0,0,0,0.85)');
    grad.addColorStop(1, 'rgba(0,0,0,1.0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }
  
  // ── Strobo overlay (drive already in stroboEnvelope) ──
  if (stroboFlash > 0.01) {
    ctx.fillStyle = `rgba(255,255,255,${stroboFlash})`;
    ctx.fillRect(0, 0, W, H);
  }
  
  // Decay
  beatFlash *= 0.7 + driveScale * 0.15; // drive 0%→decay 0.70 (fast), 100%→0.85 (slow)
  exposureOpacity *= 0.88;
  camPulseScale *= 0.85;
  // Smooth rotation toward target
  camRotCurrent += (camRotTarget - camRotCurrent) * 0.08;
  // When not beat cutting, ease rotation to 0
  if (!beatCutEnabled && PRESETS[activePreset]?.type === 'camera') {
    camRotTarget = 0;
  }
  pulseScale = pulseScale * 0.92 + 1.0 * 0.08;
  // Video jump decay — faster than pulse for TYPO-like instant pop
  videoJumpScale = videoJumpScale * 0.80 + 1.0 * 0.20;
}

// ── OMEN1: Full OmenPainter (iOS port — no video) ──────────────
function renderOmen1(pal) {
  const minD = Math.min(W, H) * GFX_SCALE;
  const [rP, gP, bP] = hexRgb(pal[2]); // primary
  const [rB, gB, bB] = hexRgb(pal[3]); // bright
  const [rD, gD, bD] = hexRgb(pal[0]); // dark
  
  // Dark radial background
  const bgGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, minD * 0.55);
  bgGrad.addColorStop(0, `rgba(${rD},${gD},${bD},0.9)`);
  bgGrad.addColorStop(0.5, `rgba(${rD},${gD},${bD},0.5)`);
  bgGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(compassAngle);
  
  // ── Mega ring (128 bars, bass, wave variation) ──────────────
  const megaR = minD * 0.44 * 2 * pulseScale;
  for (let i = 0; i < 128; i++) {
    const angle = (i / 128) * Math.PI * 2 - Math.PI / 2;
    const variation = Math.sin(angle * 7 + animTime * 2 * Math.PI) * 0.3 + 0.7;
    const barH = smoothBass * minD * 0.25 * variation;
    if (barH < 0.5) continue;
    
    const lc = lerpColor(pal[2], pal[3], smoothBass);
    const alpha = 0.35 + smoothBass * 0.3;
    
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * (megaR + 2), Math.sin(angle) * (megaR + 2));
    ctx.lineTo(Math.cos(angle) * (megaR + 2 + barH), Math.sin(angle) * (megaR + 2 + barH));
    ctx.strokeStyle = `rgba(${lc[0]|0},${lc[1]|0},${lc[2]|0},${alpha})`;
