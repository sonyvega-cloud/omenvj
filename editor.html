<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ØMEN — Scene Editor</title>
<script src="presets.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0a; --surface: #141414; --surface2: #1c1c1c;
    --border: #2a2a2a; --text: #e0e0e0; --text-dim: #666;
    --accent: #ff2200; --accent-glow: rgba(255,34,0,0.15);
    --green: #22cc44; --yellow: #ffcc00; --blue: #2266ff; --purple: #aa44ff;
  }
  body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Header */
  .header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .header h1 { font-size: 14px; font-weight: 500; letter-spacing: 0.3em; color: var(--accent); }
  .header .sub { font-size: 11px; color: var(--text-dim); letter-spacing: 0.15em; }
  .header-actions { margin-left: auto; display: flex; gap: 6px; }

  /* Buttons */
  .btn { font-family: inherit; font-size: 10px; letter-spacing: 0.12em; padding: 7px 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  .btn:hover { border-color: var(--text-dim); }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn.primary:hover { background: var(--accent-glow); }
  .btn.danger { border-color: #661100; color: #cc4422; }
  .btn.success { border-color: #116622; color: var(--green); }

  .container { max-width: 960px; margin: 0 auto; padding: 20px 24px; }

  /* Theme tabs */
  .theme-tabs { display: flex; gap: 2px; margin-bottom: 20px; }
  .theme-tab {
    padding: 10px 20px; font-family: inherit; font-size: 11px; letter-spacing: 0.2em;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
    cursor: pointer; border-bottom: 2px solid transparent;
  }
  .theme-tab:hover { color: var(--text); }
  .theme-tab.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--accent-glow); }
  .theme-tab .badge { font-size: 9px; margin-left: 6px; opacity: 0.5; }
  .theme-tab.t-omen.active { color: var(--accent); border-bottom-color: var(--accent); }
  .theme-tab.t-camera.active { color: var(--green); border-bottom-color: var(--green); }
  .theme-tab.t-voyager.active { color: var(--purple); border-bottom-color: var(--purple); }
  .theme-tab.t-typo.active { color: #ffffff; border-bottom-color: #ffffff; }

  /* Theme header */
  .theme-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .theme-name { font-size: 13px; letter-spacing: 0.2em; font-weight: 500; }
  .theme-type { font-size: 9px; color: var(--text-dim); padding: 2px 8px; border: 1px solid var(--border); letter-spacing: 0.1em; }
  .scene-count { font-size: 10px; color: var(--text-dim); }

  /* Scene list */
  .scene-list { display: flex; flex-direction: column; gap: 2px; }
  .list-header {
    display: grid; grid-template-columns: 36px 100px 130px 130px 70px 1fr 50px;
    gap: 6px; padding: 5px 10px; font-size: 9px; color: var(--text-dim); letter-spacing: 0.12em;
  }
  .scene-row {
    display: grid; grid-template-columns: 36px 100px 130px 130px 70px 1fr 50px;
    align-items: center; gap: 6px; padding: 8px 10px;
    background: var(--surface); border: 1px solid var(--border); font-size: 11px;
  }
  .scene-row:hover { border-color: var(--text-dim); }
  .scene-row.editing { border-color: var(--accent); background: var(--accent-glow); }
  .scene-idx { color: var(--text-dim); font-size: 10px; }
  .scene-name { font-weight: 500; }
  .scene-gfx { color: var(--blue); font-size: 10px; }
  .scene-source { font-size: 9px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .energy-badge { font-size: 9px; padding: 2px 6px; border-radius: 2px; text-align: center; letter-spacing: 0.08em; }
  .energy-badge.cat1 { background: rgba(34,102,255,0.15); color: var(--blue); }
  .energy-badge.cat2 { background: rgba(255,204,0,0.15); color: var(--yellow); }
  .energy-badge.cat3 { background: rgba(255,34,0,0.15); color: var(--accent); }
  .scene-actions { display: flex; gap: 3px; justify-content: flex-end; }
  .icon-btn { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: none; color: var(--text-dim); cursor: pointer; font-size: 11px; }
  .icon-btn:hover { border-color: var(--text); color: var(--text); }
  .icon-btn.del:hover { border-color: #cc4422; color: #cc4422; }

  /* Editor panel */
  .editor-panel { margin-top: 20px; padding: 18px; background: var(--surface); border: 1px solid var(--accent); display: none; }
  .editor-panel.open { display: block; }
  .editor-title { font-size: 11px; letter-spacing: 0.2em; color: var(--accent); margin-bottom: 14px; }
  .field-grid { display: grid; grid-template-columns: 90px 1fr; gap: 8px 14px; align-items: center; }
  .field-label { font-size: 10px; color: var(--text-dim); letter-spacing: 0.08em; text-align: right; }
  .field-input { font-family: inherit; font-size: 11px; padding: 5px 8px; background: var(--bg); border: 1px solid var(--border); color: var(--text); outline: none; width: 100%; max-width: 280px; }
  .field-input:focus { border-color: var(--accent); }
  .field-select { font-family: inherit; font-size: 11px; padding: 5px 8px; background: var(--bg); border: 1px solid var(--border); color: var(--text); outline: none; max-width: 280px; }
  .upload-row { display: flex; align-items: center; gap: 6px; }
  .upload-btn { font-family: inherit; font-size: 9px; letter-spacing: 0.08em; padding: 4px 10px; border: 1px dashed var(--border); background: none; color: var(--text-dim); cursor: pointer; }
  .upload-btn:hover { border-color: var(--accent); color: var(--accent); }
  .upload-status { font-size: 9px; color: var(--green); }
  .upload-status.uploading { color: var(--yellow); }
  .upload-status.error { color: #cc4422; }
  .editor-actions { margin-top: 16px; display: flex; gap: 6px; }
  .camera-note { font-size: 9px; color: var(--text-dim); padding: 6px 0; }

  /* GFX + Status */
  .gfx-section { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border); }
  .gfx-title { font-size: 11px; letter-spacing: 0.2em; color: var(--text-dim); margin-bottom: 10px; }
  .gfx-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .gfx-tag { font-size: 9px; padding: 3px 8px; border: 1px solid var(--border); color: var(--text-dim); letter-spacing: 0.08em; }
  .status-bar { margin-top: 20px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border); font-size: 9px; color: var(--text-dim); display: flex; align-items: center; gap: 10px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
</style>
</head>
<body>

<div class="header">
  <h1>ØMEN</h1>
  <span class="sub">SCENE EDITOR</span>
  <div class="header-actions">
    <button class="btn" onclick="importJSON()">IMPORT</button>
    <button class="btn primary" onclick="exportPresetsJS()">EXPORT PRESETS.JS</button>
    <button class="btn success" onclick="exportJSON()">EXPORT JSON</button>
  </div>
</div>

<div class="container">
  <script>
    const EDITOR_CDN = 'https://cdn.omenvj.com/';
    const EDITOR_WORKER = 'https://omen-upload.sony-vega.workers.dev';
  </script>

  <!-- Theme Tabs -->
  <div class="theme-tabs" id="themeTabs"></div>

  <!-- Theme Content -->
  <div id="themeContent"></div>

  <!-- Editor Panel -->
  <div class="editor-panel" id="editorPanel">
    <div class="editor-title" id="editorTitle">NEW SCENE</div>
    <div class="field-grid" id="editorFields"></div>
    <div class="editor-actions">
      <button class="btn primary" onclick="saveScene()">SAVE</button>
      <button class="btn" onclick="closeEditor()">CANCEL</button>
      <button class="btn danger" id="deleteBtn" onclick="deleteScene()" style="display:none">DELETE</button>
    </div>
  </div>

  <!-- GFX Registry -->
  <div class="gfx-section">
    <div class="gfx-title">GFX RENDERERS</div>
    <div class="gfx-list" id="gfxList"></div>
  </div>

  <!-- Event Config (for TYPO placeholders) -->
  <div class="gfx-section" style="margin-top:20px;">
    <div class="gfx-title">EVENT CONFIG <span style="font-size:8px; opacity:0.4;">(for {dj} {event} {countdown} {settime} placeholders)</span></div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:8px 0;">
      <div><span class="field-label">EVENT NAME</span><input class="field-input" id="eventName" placeholder="AFTERLIFE PRAGUE" oninput="saveEventConfig()"></div>
      <div><span class="field-label">DJ / ARTIST</span><input class="field-input" id="eventDJ" placeholder="SONY VEGA" oninput="saveEventConfig()"></div>
    </div>
    <div style="padding:4px 0;">
      <span class="field-label">COUNTDOWN TO</span>
      <input type="datetime-local" class="field-input" id="eventCountdown" style="max-width:220px;" oninput="saveEventConfig()">
    </div>
    <div style="padding:8px 0;">
      <span class="field-label">SCHEDULE <span style="font-size:8px; opacity:0.3;">(one per line: HH:MM DJ NAME)</span></span>
      <textarea class="field-input" id="eventSchedule" rows="4" placeholder="22:00 ARTBAT&#10;00:00 ANYMA&#10;02:00 TALE OF US" style="font-size:11px; font-family:monospace;" oninput="saveEventConfig()"></textarea>
    </div>
    <div style="padding:4px 0;">
      <span class="field-label">WORD LIST <span style="font-size:8px; opacity:0.3;">({random} cycles through these on beat, one per line)</span></span>
      <textarea class="field-input" id="eventWords" rows="3" placeholder="BASS&#10;DROP&#10;TECHNO&#10;OMEN&#10;RAVE" style="font-size:11px; font-family:monospace;" oninput="saveEventConfig()"></textarea>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Ready</span>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// Data Model: THEMES → SCENES
// ═══════════════════════════════════════════════════════════════

const THEMES = [
  { id: 'omen',    name: 'OMEN',    type: 'video',   color: '#ff2200', desc: 'Radial video presets' },
  { id: 'camera',  name: 'CAMERA',  type: 'camera',  color: '#22cc44', desc: 'Live camera input' },
  { id: 'voyager', name: 'VOYAGER', type: 'video',   color: '#aa44ff', desc: 'Perspective tunnel presets' },
  { id: 'typo',    name: 'TYPO',    type: 'text',    color: '#ffffff', desc: 'Fullscreen typography' },
];

const GFX_REGISTRY = [
  { id: 'omen1_full', name: 'Radial Mega Ring' },
  { id: 'video_rings', name: 'Video Rings' },
  { id: 'beat_circles', name: 'Beat Circles' },
  { id: 'dot_matrix', name: 'Dot Matrix' },
  { id: 'crosshair', name: 'Crosshair Scope' },
  { id: 'data_scope', name: 'Data Scope' },
  { id: 'text_overlay', name: 'Text Overlay' },
  { id: 'typo', name: 'TYPO Fullscreen' },
];

// scenes = flat array, each has themeId
let scenes = [];
let activeTheme = 'omen';
let editingIdx = -1;

// ═══════════════════════════════════════════════════════════════
// Load / Save
// ═══════════════════════════════════════════════════════════════

function loadScenes() {
  const saved = localStorage.getItem('omen_scenes');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed.length > 0) { scenes = parsed; renderAll(); return; }
    } catch(e) {}
  }
  // Migrate from old presets format
  const oldPresets = localStorage.getItem('omen_presets');
  if (oldPresets) {
    try {
      const parsed = JSON.parse(oldPresets);
      if (parsed.length > 0) {
        scenes = parsed.map(p => ({
          ...p,
          themeId: 'omen',
          type: p.videoA ? 'video' : 'gfx',
        }));
        saveToStorage();
        renderAll();
        return;
      }
    } catch(e) {}
  }
  // Defaults from presets.js
  scenes = getDefaults();
  renderAll();
}

function getDefaults() {
  if (typeof PRESETS_DATA !== 'undefined' && PRESETS_DATA.length > 0) {
    return PRESETS_DATA.map(p => ({
      name: p.name,
      gfx: p.gfx,
      energy: p.energy,
      themeId: 'omen',
      type: p.videoA ? 'video' : 'gfx',
      videoA: p.videoA ? p.videoA.replace(EDITOR_CDN, '') : null,
      videoB: p.videoB ? p.videoB.replace(EDITOR_CDN, '') : null,
      deviceId: null,
      deviceLabel: null,
    }));
  }
  return [{ name: 'OMEN1', gfx: 'omen1_full', energy: 1, themeId: 'omen', type: 'gfx', videoA: null, videoB: null, deviceId: null, deviceLabel: null }];
}

function saveToStorage() {
  localStorage.setItem('omen_scenes', JSON.stringify(scenes));
  // Flattened presets for player — include ALL fields
  const presets = scenes.map(s => ({
    name: s.name,
    gfx: s.gfx,
    energy: s.energy,
    videoA: s.type === 'video' ? s.videoA : null,
    videoB: s.type === 'video' ? s.videoB : null,
    type: s.type || 'video',
    themeId: s.themeId || 'omen',
    camSource: s.camSource || null,
    deviceId: s.deviceId || null,
    deviceLabel: s.deviceLabel || null,
    text: s.text || null,
    font: s.font || null,
    weight: s.weight || null,
    spacing: s.spacing || null,
    fx: s.fx || null,
    logoUrl: s.logoUrl || null,
    logoSize: s.logoSize || null,
    lines: s.lines || null,
    gfxText: s.gfxText || null,
    gfxSubText: s.gfxSubText || null,
  }));
  localStorage.setItem('omen_presets', JSON.stringify(presets));
  // Hot-reload: tell player to rebuild presets
  try { new BroadcastChannel('omen').postMessage({ type: 'presets_updated' }); } catch(e) {}
  setStatus('Saved');
}

// ═══════════════════════════════════════════════════════════════
// Render
// ═══════════════════════════════════════════════════════════════

function renderAll() {
  renderTabs();
  renderThemeContent();
  renderGfxList();
}

function renderTabs() {
  const el = document.getElementById('themeTabs');
  el.innerHTML = '';
  THEMES.forEach(t => {
    const count = scenes.filter(s => s.themeId === t.id).length;
    const tab = document.createElement('button');
    tab.className = 'theme-tab t-' + t.id + (activeTheme === t.id ? ' active' : '');
    tab.innerHTML = t.name + '<span class="badge">' + count + '</span>';
    tab.onclick = () => { activeTheme = t.id; closeEditor(); renderAll(); };
    el.appendChild(tab);
  });
}

function renderThemeContent() {
  const theme = THEMES.find(t => t.id === activeTheme);
  const themeScenes = scenes.map((s, i) => ({ ...s, _idx: i })).filter(s => s.themeId === activeTheme);
  const el = document.getElementById('themeContent');

  // Header
  let html = '<div class="theme-header">';
  html += '<span class="theme-name" style="color:' + theme.color + '">' + theme.name + '</span>';
  html += '<span class="theme-type">' + theme.type.toUpperCase() + '</span>';
  html += '<span class="scene-count">' + themeScenes.length + ' scenes</span>';
  html += '<div style="margin-left:auto"><button class="btn primary" onclick="addScene()">+ ADD SCENE</button></div>';
  html += '</div>';

  // Column headers
  if (theme.type === 'camera') {
    html += '<div class="list-header"><span>#</span><span>NAME</span><span>GFX</span><span>DEVICE</span><span>ENERGY</span><span></span><span></span></div>';
  } else if (theme.type === 'text') {
    html += '<div class="list-header"><span>#</span><span>NAME</span><span>GFX</span><span>TEXT</span><span>FX</span><span>ENERGY</span><span></span></div>';
  } else {
    html += '<div class="list-header"><span>#</span><span>NAME</span><span>GFX</span><span>VIDEO A</span><span>ENERGY</span><span>VIDEO B</span><span></span></div>';
  }

  // Scenes
  html += '<div class="scene-list">';
  themeScenes.forEach((s, localIdx) => {
    const eClass = s.energy === 1 ? 'cat1' : s.energy === 2 ? 'cat2' : 'cat3';
    const eLabel = s.energy === 1 ? 'AMB' : s.energy === 2 ? 'BLD' : 'GRV';
    const editing = editingIdx === s._idx ? ' editing' : '';

    html += '<div class="scene-row' + editing + '">';
    html += '<span class="scene-idx">#' + (localIdx + 1) + '</span>';
    html += '<span class="scene-name">' + s.name + '</span>';
    html += '<span class="scene-gfx">' + (s.gfx || '—') + '</span>';

    if (theme.type === 'camera') {
      html += '<span class="scene-source">' + (s.deviceLabel || 'Select camera...') + '</span>';
    } else if (theme.type === 'text') {
      html += '<span class="scene-source" style="font-weight:bold;">' + (s.text || 'no text') + '</span>';
      html += '<span class="scene-gfx" style="font-size:9px; opacity:0.6;">' + (s.fx || 'none') + '</span>';
    } else {
      html += '<span class="scene-source">' + (s.videoA || 'no video') + '</span>';
    }

    html += '<span class="energy-badge ' + eClass + '">' + eLabel + '</span>';

    if (theme.type === 'video') {
      html += '<span class="scene-source">' + (s.videoB || '') + '</span>';
    } else {
      html += '<span></span>';
    }

    html += '<div class="scene-actions">';
    html += '<button class="icon-btn" onclick="editScene(' + s._idx + ')" title="Edit">✎</button>';
    html += '<button class="icon-btn del" onclick="confirmDelete(' + s._idx + ')" title="Delete">×</button>';
    html += '</div></div>';
  });
  html += '</div>';

  el.innerHTML = html;
}

function renderGfxList() {
  const el = document.getElementById('gfxList');
  const allGfx = new Set(GFX_REGISTRY.map(g => g.id));
  scenes.forEach(s => { if (s.gfx) allGfx.add(s.gfx); });
  el.innerHTML = '';
  allGfx.forEach(id => {
    const tag = document.createElement('span');
    tag.className = 'gfx-tag';
    tag.textContent = id;
    el.appendChild(tag);
  });
}

// ═══════════════════════════════════════════════════════════════
// Editor
// ═══════════════════════════════════════════════════════════════

function buildEditorFields() {
  const theme = THEMES.find(t => t.id === activeTheme);
  const fields = document.getElementById('editorFields');

  // Collect GFX options
  const allGfx = new Set(GFX_REGISTRY.map(g => g.id));
  scenes.forEach(s => { if (s.gfx) allGfx.add(s.gfx); });
  const gfxOptions = [...allGfx].map(id => {
    const reg = GFX_REGISTRY.find(g => g.id === id);
    return '<option value="' + id + '">' + id + (reg ? ' (' + reg.name + ')' : '') + '</option>';
  }).join('');

  let html = '';
  html += '<span class="field-label">NAME</span><input class="field-input" id="editName">';
  html += '<span class="field-label">GFX</span><select class="field-select" id="editGfx" onchange="onGfxChange()">' + gfxOptions + '</select>';
  html += '<div id="textFields" style="display:none;">';
  html += '<span class="field-label">MAIN TEXT</span><input class="field-input" id="editGfxText" placeholder="ØMEN">';
  html += '<span class="field-label">SUBTITLE</span><input class="field-input" id="editGfxSubText" placeholder="Optional subtitle">';
  html += '</div>';
  html += '<span class="field-label">ENERGY</span><select class="field-select" id="editEnergy">';
  html += '<option value="1">CAT 1 — ambient</option><option value="2">CAT 2 — building</option><option value="3">CAT 3 — groove</option></select>';

  if (theme.type === 'camera') {
    html += '<span class="field-label">SOURCE</span><select class="field-select" id="editCamSource" onchange="onCamSourceChange()">';
    html += '<option value="remote">REMOTE (phone via relay)</option>';
    html += '<option value="local">LOCAL (webcam on player PC)</option></select>';
    html += '<span class="field-label">DEVICE</span><div id="camDeviceRow"><button class="btn" onclick="pickCamera()" id="pickCamBtn">SELECT CAMERA</button> <span id="camLabel" class="camera-note">Auto-pick on player</span></div>';
    html += '<input type="hidden" id="editDeviceId"><input type="hidden" id="editDeviceLabel"><input type="hidden" id="editCamSource2">';
  } else if (theme.type === 'text') {
    // Mode toggle: TEXT or LOGO
    html += '<span class="field-label">MODE</span>';
    html += '<div style="display:flex; gap:4px; margin-bottom:8px;">';
    html += '<button class="btn" id="modeText" onclick="setTypoMode(\'text\')" style="flex:1; font-size:10px;">TEXT</button>';
    html += '<button class="btn" id="modeLogo" onclick="setTypoMode(\'logo\')" style="flex:1; font-size:10px;">LOGO</button>';
    html += '</div>';
    
    // TEXT mode fields
    html += '<div id="typoTextFields">';
    html += '<span class="field-label">TEXT (each line = separate line on screen)</span>';
    html += '<textarea class="field-input" id="editText" placeholder="ØMEN&#10;{mood}&#10;{random}" rows="3" style="font-size:16px; font-weight:900; letter-spacing:0.15em; resize:vertical;"></textarea>';
    html += '<div style="font-size:8px; color:rgba(255,255,255,0.25); letter-spacing:0.05em; margin:4px 0 8px; line-height:1.6;">';
    html += 'PLACEHOLDERS: <span style="color:rgba(255,255,255,0.4)">{mood}</span> {energy} {day} {beats} {random} {dj} {event} {countdown} {settime}</div>';
    html += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px;">';
    html += '<div><span class="field-label">FONT</span><select class="field-select" id="editFont">';
    html += '<option value="Helvetica Neue">Helvetica Neue</option>';
    html += '<option value="Arial Black">Arial Black</option>';
    html += '<option value="Impact">Impact</option>';
    html += '<option value="Futura">Futura</option>';
    html += '<option value="Courier New">Courier New</option>';
    html += '<option value="Georgia">Georgia</option>';
    html += '<option value="Times New Roman">Times New Roman</option>';
    html += '<option value="system-ui">System UI</option>';
    html += '</select></div>';
    html += '<div><span class="field-label">WEIGHT</span><select class="field-select" id="editWeight">';
    html += '<option value="100">100 Thin</option><option value="300">300 Light</option>';
    html += '<option value="400">400 Regular</option><option value="700">700 Bold</option>';
    html += '<option value="900" selected>900 Black</option></select></div>';
    html += '</div>';
    html += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px;">';
    html += '<div><span class="field-label">LETTER SPACING</span>';
    html += '<input type="range" id="editSpacing" min="-5" max="40" value="10" style="width:100%">';
    html += '<span id="editSpacingVal" style="font-size:9px; opacity:0.4;">10px</span></div>';
    html += '<div><span class="field-label">FX</span><select class="field-select" id="editFx">';
    html += '<option value="none">NONE</option>';
    html += '<option value="jump">JUMP — position snap</option>';
    html += '<option value="scale">SCALE — zoom punch</option>';
    html += '<option value="glitch">GLITCH — RGB split</option>';
    html += '<option value="invert">INVERT — black↔white</option>';
    html += '<option value="strobo">STROBO — rapid flash</option>';
    html += '<option value="shake">SHAKE — vibration</option>';
    html += '</select></div>';
    html += '</div>';
    html += '</div>';
    
    // LOGO mode fields
    html += '<div id="typoLogoFields" style="display:none;">';
    html += '<span class="field-label">LOGO PNG</span>';
    html += '<div class="upload-row">';
    html += '<input class="field-input" id="editLogoUrl" style="max-width:200px" placeholder="https://cdn...">';
    html += '<input type="file" id="fileLogo" accept="image/png,image/svg+xml" style="display:none" onchange="handleLogoUpload()">';
    html += '<button class="upload-btn" onclick="document.getElementById(\'fileLogo\').click()">UPLOAD</button>';
    html += '<span class="upload-status" id="statusLogo"></span></div>';
    html += '<span class="field-label">SIZE</span>';
    html += '<input type="range" id="editLogoSize" min="10" max="80" value="40" style="width:100%">';
    html += '<span id="editLogoSizeVal" style="font-size:9px; opacity:0.4;">40%</span>';
    html += '<div><span class="field-label">FX</span><select class="field-select" id="editLogoFx">';
    html += '<option value="none">NONE</option>';
    html += '<option value="jump">JUMP</option><option value="scale">SCALE</option>';
    html += '<option value="glitch">GLITCH</option><option value="invert">INVERT</option>';
    html += '<option value="strobo">STROBO</option><option value="shake">SHAKE</option>';
    html += '</select></div>';
    html += '</div>';
    
    // Preview — full width, taller
    html += '<div id="typoPreview" style="margin-top:12px; padding:24px 8px; background:#000; overflow:hidden; text-align:center; border:1px solid #222; min-height:80px;"></div>';
  } else {
    html += '<span class="field-label">VIDEO A</span><div class="upload-row">';
    html += '<input class="field-input" id="editVideoA" style="max-width:180px">';
    html += '<input type="file" id="fileA" accept="video/mp4" style="display:none" onchange="handleUpload(\'A\')">';
    html += '<button class="upload-btn" onclick="document.getElementById(\'fileA\').click()">UPLOAD</button>';
    html += '<span class="upload-status" id="statusA"></span></div>';

    html += '<span class="field-label">VIDEO B</span><div class="upload-row">';
    html += '<input class="field-input" id="editVideoB" style="max-width:180px">';
    html += '<input type="file" id="fileB" accept="video/mp4" style="display:none" onchange="handleUpload(\'B\')">';
    html += '<button class="upload-btn" onclick="document.getElementById(\'fileB\').click()">UPLOAD</button>';
    html += '<span class="upload-status" id="statusB"></span></div>';
  }

  fields.innerHTML = html;
}

function addScene() {
  editingIdx = -1;
  const theme = THEMES.find(t => t.id === activeTheme);
  document.getElementById('editorTitle').textContent = 'NEW ' + theme.name + ' SCENE';
  document.getElementById('deleteBtn').style.display = 'none';
  buildEditorFields();

  // Defaults
  const count = scenes.filter(s => s.themeId === activeTheme).length;
  const prefixes = { camera: 'CAM', voyager: 'VOY', typo: 'TXT', omen: 'OMEN' };
  const prefix = prefixes[activeTheme] || activeTheme.toUpperCase();
  document.getElementById('editName').value = prefix + (count + 1);
  const defaultGfx = { typo: 'typo', camera: 'video_rings', voyager: 'video_rings', omen: 'video_rings' };
  document.getElementById('editGfx').value = defaultGfx[activeTheme] || 'video_rings';
  document.getElementById('editEnergy').value = '3';

  // Typo defaults
  if (activeTheme === 'typo') {
    setTypoMode('text');
    const tEl = document.getElementById('editText');
    if (tEl) tEl.value = 'ØMEN';
    attachTypoListeners();
    setTimeout(updateTypoPreview, 50);
  }

  document.getElementById('editorPanel').classList.add('open');
  renderAll();
}

function editScene(idx) {
  editingIdx = idx;
  const s = scenes[idx];
  const theme = THEMES.find(t => t.id === s.themeId);
  document.getElementById('editorTitle').textContent = 'EDIT — ' + s.name;
  document.getElementById('deleteBtn').style.display = 'inline-block';
  buildEditorFields();

  document.getElementById('editName').value = s.name;
  document.getElementById('editGfx').value = s.gfx;
  document.getElementById('editEnergy').value = s.energy;
  onGfxChange(); // show/hide text fields
  if (s.gfx === 'text_overlay') {
    const tf = document.getElementById('editGfxText');
    const sf = document.getElementById('editGfxSubText');
    if (tf) tf.value = s.gfxText || '';
    if (sf) sf.value = s.gfxSubText || '';
  }

  if (theme.type === 'camera') {
    document.getElementById('editCamSource').value = s.camSource || 'remote';
    document.getElementById('editDeviceId').value = s.deviceId || '';
    document.getElementById('editDeviceLabel').value = s.deviceLabel || '';
    document.getElementById('camLabel').textContent = s.deviceLabel || 'Auto-pick on player';
    onCamSourceChange();
  } else if (theme.type === 'text') {
    // Detect mode: logo if logoUrl exists
    const mode = s.logoUrl ? 'logo' : 'text';
    setTypoMode(mode);
    
    if (mode === 'text') {
      const tEl = document.getElementById('editText');
      if (tEl) tEl.value = s.text || '';
      const fEl = document.getElementById('editFont');
      if (fEl) fEl.value = s.font || 'Helvetica Neue';
      const wEl = document.getElementById('editWeight');
      if (wEl) wEl.value = s.weight || '900';
      const sEl = document.getElementById('editSpacing');
      if (sEl) { sEl.value = s.spacing || 10; document.getElementById('editSpacingVal').textContent = sEl.value + 'px'; }
      const fxEl = document.getElementById('editFx');
      if (fxEl) fxEl.value = s.fx || 'none';
    } else {
      const luEl = document.getElementById('editLogoUrl');
      if (luEl) luEl.value = s.logoUrl || '';
      const lsEl = document.getElementById('editLogoSize');
      if (lsEl) { lsEl.value = s.logoSize || 40; document.getElementById('editLogoSizeVal').textContent = lsEl.value + '%'; }
      const lfxEl = document.getElementById('editLogoFx');
      if (lfxEl) lfxEl.value = s.fx || 'none';
    }
    attachTypoListeners();
    updateTypoPreview();
  } else {
    document.getElementById('editVideoA').value = s.videoA || '';
    document.getElementById('editVideoB').value = s.videoB || '';
  }

  document.getElementById('editorPanel').classList.add('open');
  renderAll();
}

function onGfxChange() {
  const gfx = document.getElementById('editGfx')?.value;
  const tf = document.getElementById('textFields');
  if (tf) tf.style.display = gfx === 'text_overlay' ? 'block' : 'none';
}

let typoMode = 'text';

function setTypoMode(mode) {
  typoMode = mode;
  const tf = document.getElementById('typoTextFields');
  const lf = document.getElementById('typoLogoFields');
  if (tf) tf.style.display = mode === 'text' ? 'block' : 'none';
  if (lf) lf.style.display = mode === 'logo' ? 'block' : 'none';
  document.getElementById('modeText').className = 'btn' + (mode === 'text' ? ' primary' : '');
  document.getElementById('modeLogo').className = 'btn' + (mode === 'logo' ? ' primary' : '');
  updateTypoPreview();
}

async function handleLogoUpload() {
  const file = document.getElementById('fileLogo').files[0];
  if (!file) return;
  const status = document.getElementById('statusLogo');
  const urlInput = document.getElementById('editLogoUrl');
  const fileName = 'logo_' + Date.now() + '.' + (file.name.split('.').pop() || 'png');
  
  if (!EDITOR_WORKER) { urlInput.value = fileName; status.textContent = 'manual'; return; }
  
  status.textContent = 'uploading...';
  try {
    const ct = file.type || 'image/png';
    const resp = await fetch(EDITOR_WORKER + '/upload/' + fileName, {
      method: 'PUT', body: file, headers: { 'Content-Type': ct }
    });
    if (resp.ok) {
      urlInput.value = EDITOR_CDN + fileName;
      status.textContent = '✓';
      updateTypoPreview();
    } else { status.textContent = 'error: ' + resp.status; }
  } catch(e) { status.textContent = 'failed'; }
}

function updateTypoPreview() {
  const preview = document.getElementById('typoPreview');
  if (!preview) return;
  
  if (typoMode === 'logo') {
    const url = document.getElementById('editLogoUrl')?.value;
    const size = document.getElementById('editLogoSize')?.value || 40;
    if (url) {
      preview.innerHTML = '<img src="' + url + '" style="max-width:' + size + '%; max-height:120px; object-fit:contain;">';
    } else {
      preview.innerHTML = '<div style="color:#333; font-size:11px;">Upload logo PNG</div>';
    }
    return;
  }
  
  const text = document.getElementById('editText')?.value || 'PREVIEW';
  const font = document.getElementById('editFont')?.value || 'Helvetica Neue';
  const weight = document.getElementById('editWeight')?.value || '900';
  const spacing = document.getElementById('editSpacing')?.value || '10';
  
  const lines = text.split('\n').filter(l => l.trim());
  let html = '';
  lines.forEach((line, i) => {
    html += '<div class="typoPreviewLine" style="font-family:\'' + font + '\',sans-serif; font-weight:' + weight + '; letter-spacing:' + spacing + 'px; color:#fff; white-space:nowrap; line-height:1.15;">' + line + '</div>';
  });
  preview.innerHTML = html;
  
  // Auto-scale each line to fill preview width
  preview.querySelectorAll('.typoPreviewLine').forEach(el => {
    const pw = preview.clientWidth - 16;
    if (el.scrollWidth > 0 && pw > 0) {
      const scale = Math.min(pw / el.scrollWidth, 3);
      el.style.fontSize = Math.floor(36 * scale) + 'px';
    }
  });
}

function attachTypoListeners() {
  const t = document.getElementById('editText');
  const f = document.getElementById('editFont');
  const w = document.getElementById('editWeight');
  const s = document.getElementById('editSpacing');
  const ls = document.getElementById('editLogoSize');
  const lu = document.getElementById('editLogoUrl');
  if (t) t.addEventListener('input', updateTypoPreview);
  if (f) f.addEventListener('change', updateTypoPreview);
  if (w) w.addEventListener('change', updateTypoPreview);
  if (s) s.addEventListener('input', function() {
    document.getElementById('editSpacingVal').textContent = this.value + 'px';
    updateTypoPreview();
  });
  if (ls) ls.addEventListener('input', function() {
    document.getElementById('editLogoSizeVal').textContent = this.value + '%';
    updateTypoPreview();
  });
  if (lu) lu.addEventListener('input', updateTypoPreview);
}

function saveScene() {
  const theme = THEMES.find(t => t.id === activeTheme);
  const name = document.getElementById('editName').value.trim();
  if (!name) { alert('Name required'); return; }

  const gfx = document.getElementById('editGfx').value;
  
  // Determine type
  let sceneType = 'gfx';
  if (theme.type === 'camera') sceneType = 'camera';
  else if (theme.type === 'text') sceneType = 'text';
  else if (document.getElementById('editVideoA')?.value) sceneType = 'video';
  
  // Typo text + font properties
  let typoText = null, typoFont = null, typoWeight = null, typoSpacing = null;
  if (theme.type === 'text' && typoMode === 'text') {
    typoText = document.getElementById('editText')?.value.trim() || 'ØMEN';
    typoFont = document.getElementById('editFont')?.value || 'Helvetica Neue';
    typoWeight = document.getElementById('editWeight')?.value || '900';
    typoSpacing = parseInt(document.getElementById('editSpacing')?.value || '10');
  }
  const typoFx = theme.type === 'text' ? (
    typoMode === 'text' ? (document.getElementById('editFx')?.value || 'none') :
    (document.getElementById('editLogoFx')?.value || 'none')
  ) : null;
  const logoUrl = (theme.type === 'text' && typoMode === 'logo') ? (document.getElementById('editLogoUrl')?.value.trim() || null) : null;
  const logoSize = (theme.type === 'text' && typoMode === 'logo') ? parseInt(document.getElementById('editLogoSize')?.value || '40') : null;
  
  const scene = {
    name,
    gfx,
    energy: parseInt(document.getElementById('editEnergy').value),
    themeId: activeTheme,
    type: sceneType,
    videoA: theme.type === 'video' ? (document.getElementById('editVideoA')?.value.trim() || null) : null,
    videoB: theme.type === 'video' ? (document.getElementById('editVideoB')?.value.trim() || null) : null,
    camSource: theme.type === 'camera' ? (document.getElementById('editCamSource')?.value || 'remote') : null,
    deviceId: theme.type === 'camera' ? (document.getElementById('editDeviceId')?.value || null) : null,
    deviceLabel: theme.type === 'camera' ? (document.getElementById('editDeviceLabel')?.value || null) : null,
    text: typoText,
    font: typoFont,
    weight: typoWeight,
    spacing: typoSpacing,
    fx: typoFx,
    logoUrl: logoUrl,
    logoSize: logoSize,
    gfxText: gfx === 'text_overlay' ? (document.getElementById('editGfxText')?.value.trim() || null) : null,
    gfxSubText: gfx === 'text_overlay' ? (document.getElementById('editGfxSubText')?.value.trim() || null) : null,
  };

  if (editingIdx >= 0) {
    scenes[editingIdx] = scene;
  } else {
    scenes.push(scene);
  }

  saveToStorage();
  closeEditor();
  renderAll();
}

function closeEditor() {
  editingIdx = -1;
  document.getElementById('editorPanel').classList.remove('open');
  renderAll();
}

function confirmDelete(idx) {
  if (confirm('Delete ' + scenes[idx].name + '?')) {
    scenes.splice(idx, 1);
    saveToStorage();
    closeEditor();
    renderAll();
  }
}

function deleteScene() { if (editingIdx >= 0) confirmDelete(editingIdx); }

// ═══════════════════════════════════════════════════════════════
// Camera Picker
// ═══════════════════════════════════════════════════════════════

function onCamSourceChange() {
  const src = document.getElementById('editCamSource').value;
  const devRow = document.getElementById('camDeviceRow');
  const pickBtn = document.getElementById('pickCamBtn');
  if (src === 'remote') {
    devRow.style.display = 'none';
  } else {
    devRow.style.display = 'block';
  }
}

async function pickCamera() {
  try {
    const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
    tempStream.getTracks().forEach(t => t.stop());
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cameras = devices.filter(d => d.kind === 'videoinput');

    if (cameras.length === 0) { alert('No cameras found'); return; }

    const pick = prompt('Available cameras:\\n' + cameras.map((c, i) => (i + 1) + '. ' + (c.label || 'Camera ' + (i + 1))).join('\\n') + '\\n\\nEnter number:');
    const idx = parseInt(pick) - 1;
    if (idx >= 0 && idx < cameras.length) {
      document.getElementById('editDeviceId').value = cameras[idx].deviceId;
      document.getElementById('editDeviceLabel').value = cameras[idx].label || 'Camera ' + (idx + 1);
      document.getElementById('camLabel').textContent = cameras[idx].label || 'Camera ' + (idx + 1);
    }
  } catch (err) {
    alert('Camera access denied: ' + err.message);
  }
}

// ═══════════════════════════════════════════════════════════════
// Upload
// ═══════════════════════════════════════════════════════════════

async function handleUpload(ab) {
  const fileInput = document.getElementById('file' + ab);
  const statusEl = document.getElementById('status' + ab);
  const nameInput = document.getElementById('editVideo' + ab);
  if (!fileInput.files[0]) return;
  const file = fileInput.files[0];
  const fileName = file.name.toLowerCase().replace(/[^a-z0-9._-]/g, '');

  if (!EDITOR_WORKER) { nameInput.value = fileName; statusEl.textContent = 'manual upload'; return; }

  statusEl.textContent = 'uploading...'; statusEl.className = 'upload-status uploading';
  try {
    const resp = await fetch(EDITOR_WORKER + '/upload/' + fileName, { method: 'PUT', body: file, headers: { 'Content-Type': 'video/mp4' } });
    if (resp.ok) { nameInput.value = fileName; statusEl.textContent = '✓ uploaded'; statusEl.className = 'upload-status'; }
    else { statusEl.textContent = 'error: ' + resp.status; statusEl.className = 'upload-status error'; }
  } catch (err) { statusEl.textContent = 'error'; statusEl.className = 'upload-status error'; }
}

// ═══════════════════════════════════════════════════════════════
// Event Config (TYPO placeholders)
// ═══════════════════════════════════════════════════════════════

function saveEventConfig() {
  const wordsRaw = document.getElementById('eventWords')?.value || '';
  const config = {
    event: document.getElementById('eventName')?.value.trim() || '',
    dj: document.getElementById('eventDJ')?.value.trim() || '',
    countdownTo: document.getElementById('eventCountdown')?.value || null,
    schedule: parseSchedule(document.getElementById('eventSchedule')?.value || ''),
    words: wordsRaw.split('\n').map(w => w.trim()).filter(w => w),
  };
  localStorage.setItem('omen_event', JSON.stringify(config));
  // Hot-reload to player
  try { new BroadcastChannel('omen').postMessage({ type: 'event_updated' }); } catch(e) {}
}

function parseSchedule(text) {
  return text.split('\n').map(line => {
    const m = line.trim().match(/^(\d{1,2}:\d{2})\s+(.+)$/);
    if (!m) return null;
    return { time: m[1], dj: m[2].trim() };
  }).filter(Boolean);
}

function loadEventConfig() {
  try {
    const ec = localStorage.getItem('omen_event');
    if (!ec) return;
    const config = JSON.parse(ec);
    const nameEl = document.getElementById('eventName');
    const djEl = document.getElementById('eventDJ');
    const cdEl = document.getElementById('eventCountdown');
    const schEl = document.getElementById('eventSchedule');
    if (nameEl) nameEl.value = config.event || '';
    if (djEl) djEl.value = config.dj || '';
    if (cdEl) cdEl.value = config.countdownTo || '';
    if (schEl && config.schedule) {
      schEl.value = config.schedule.map(s => s.time + ' ' + s.dj).join('\n');
    }
    const wordsEl = document.getElementById('eventWords');
    if (wordsEl && config.words && config.words.length > 0) {
      wordsEl.value = config.words.join('\n');
    }
  } catch(e) {}
}

// ═══════════════════════════════════════════════════════════════
// Export / Import
// ═══════════════════════════════════════════════════════════════

function exportPresetsJS() {
  let lines = ['// ØMEN Preset Registry — generated by Scene Editor'];
  lines.push("const CDN = '" + EDITOR_CDN + "';");
  lines.push('');
  lines.push('const PRESETS_DATA = [');
  scenes.forEach((s, i) => {
    const va = s.type === 'video' && s.videoA ? 'CDN+"' + s.videoA + '"' : 'null';
    const vb = s.type === 'video' && s.videoB ? 'CDN+"' + s.videoB + '"' : 'null';
    const extra = s.type === 'camera' ? ', "type": "camera"' : '';
    const comma = i < scenes.length - 1 ? ',' : '';
    lines.push('  { "name": "' + s.name + '", "videoA": ' + va + ', "videoB": ' + vb + ', "gfx": "' + s.gfx + '", "energy": ' + s.energy + extra + ' }' + comma);
  });
  lines.push('];');
  downloadFile('presets.js', lines.join('\n'));
  setStatus('Exported presets.js');
}

function exportJSON() {
  downloadFile('omen-scenes.json', JSON.stringify({ themes: THEMES, scenes }, null, 2));
  setStatus('Exported JSON');
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.scenes) { scenes = data.scenes; }
        else if (data.presets) { scenes = data.presets.map(p => ({ ...p, themeId: p.themeId || 'omen', type: p.type || (p.videoA ? 'video' : 'gfx') })); }
        saveToStorage(); renderAll();
        setStatus('Imported ' + scenes.length + ' scenes');
      } catch (err) { alert('Invalid JSON'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ═══════════════════════════════════════════════════════════════
// Helpers
// ═══════════════════════════════════════════════════════════════

function downloadFile(name, content) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: 'text/plain' }));
  a.download = name; a.click();
}

function setStatus(text) {
  document.getElementById('statusText').textContent = text;
}

// Init
loadScenes();
loadEventConfig();
