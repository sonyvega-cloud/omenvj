name = "omen-relay"
main = "relay-worker.js"
compatibility_date = "2024-01-01"

# KV namespace for PIN → session mapping
[[kv_namespaces]]
binding = "OMEN_PINS"
id = ""  # Fill after creating KV namespace

# Durable Objects for WebSocket sessions
[durable_objects]
bindings = [
  { name = "OMEN_SESSIONS", class_name = "OmenSession" }
]

[[migrations]]
tag = "v1"
new_classes = ["OmenSession"]
